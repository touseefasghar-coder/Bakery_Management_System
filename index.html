<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DAN BAKERS — POS & Khata Suite</title>
  
  <!-- Browser Tab Favicon (Golden Biscuit with DAN) -->
  <link id="dynamic-favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230B1120'/%3E%3Ccircle cx='50' cy='50' r='38' fill='%23d97706' stroke='%23fbbf24' stroke-width='4' stroke-dasharray='8 4'/%3E%3Ccircle cx='50' cy='50' r='30' fill='%23f59e0b'/%3E%3Ctext x='50' y='57' text-anchor='middle' font-family='Arial, sans-serif' font-weight='900' font-size='22' fill='%23451a03' letter-spacing='1'%3EDAN%3C/text%3E%3C/svg%3E" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f3f6fa; }
    
    @media print {
      @page { margin: 4mm; }
      html, body { 
        height: auto !important; 
        overflow: visible !important; 
        background: white !important; 
        margin: 0 !important;
        padding: 0 !important;
      }
      body * { visibility: hidden; }
      #printable-area, #printable-area * { 
        visibility: visible !important; 
        line-height: 1.45 !important;
        letter-spacing: normal !important;
      }
      #printable-area { 
        position: fixed !important; 
        left: 0 !important; 
        top: 0 !important; 
        width: 100% !important; 
        max-width: 78mm !important; 
        max-height: none !important;
        height: auto !important;
        overflow: visible !important;
        box-shadow: none !important; 
        margin: 0 auto !important; 
        padding: 6px !important; 
        background: white !important; 
        color: #000 !important;
      }
      .no-print { display: none !important; }
    }
    
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .hide-scroll::-webkit-scrollbar { display: none; }
    
    .fade-in { animation: fadeIn 0.25s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .toast-slide { animation: toastSlide 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes toastSlide {
      from { opacity: 0; transform: translateY(-20px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>
<body class="text-slate-800">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const DEFAULT_SETTINGS = {
      name: 'DAN BAKERS',
      address: 'Kot Sai Singh (Jhang)',
      owner: 'Muhammad Touseef',
      ownerContact: '0370-0549734',
      ownerUsername: 'touseef',
      ownerPin: '5555',
      ownerSecurityKey: 'DAN-OWN-88',
      manager: 'Tayyab',
      managerContact: '0312-5505874',
      managerUsername: 'tayyab',
      pin: '1234',
      managerSecurityKey: 'DAN-MGR-99',
      logoUrl: ''
    };

    const getStore = (key, defaultVal) => {
      try {
        const v = localStorage.getItem(key);
        if (!v) return defaultVal;
        const parsed = JSON.parse(v);
        if (key === 'bakery_settings' && typeof parsed === 'object' && parsed !== null) {
          return { ...defaultVal, ...parsed };
        }
        if (Array.isArray(defaultVal) && !Array.isArray(parsed)) {
          return defaultVal;
        }
        return parsed;
      } catch (e) {
        return defaultVal;
      }
    };

    const initialProducts = [
      { id: '1', name: 'Premium Fruit Cake', category: 'Cakes', packingType: 'weight', sp1: 1200, sp2: 2300, wsSp1: 1050, wsSp2: 2000, reg1: 900, reg2: 1700, wsReg1: 800, wsReg2: 1500 },
      { id: '2', name: 'Crispy Zeera Biscuits', category: 'Biscuits', packingType: 'weight', sp1: 800, sp2: 1550, wsSp1: 700, wsSp2: 1350, reg1: 600, reg2: 1150, wsReg1: 500, wsReg2: 1000 },
      { id: '3', name: 'Crunchy Special Rusk', category: 'Rusk', packingType: 'pack', sp1: 250, sp2: 1200, wsSp1: 210, wsSp2: 1000, reg1: 180, reg2: 850, wsReg1: 150, wsReg2: 720 }
    ];

    // Custom Biscuit Logo with "DAN" Engraved Inside
    const BrandLogo = ({ size = "md", customLogoUrl = "" }) => {
      const dims = size === "lg" ? "w-24 h-24" : size === "sm" ? "w-10 h-10" : "w-12 h-12";
      if (customLogoUrl && customLogoUrl.trim()) {
        return (
          <img 
            src={customLogoUrl.trim()} 
            alt="DAN Biscuit Logo" 
            className={`${dims} rounded-full object-cover border-2 border-amber-400 shadow-lg shrink-0 bg-white`} 
          />
        );
      }
      return (
        <div className={`${dims} shrink-0 flex items-center justify-center drop-shadow-[0_6px_14px_rgba(245,158,11,0.35)]`}>
          <svg viewBox="0 0 100 100" className="w-full h-full">
            <defs>
              <radialGradient id="biscuitGrad" cx="35%" cy="30%" r="70%">
                <stop offset="0%" stopColor="#fde68a" />
                <stop offset="45%" stopColor="#f59e0b" />
                <stop offset="85%" stopColor="#b45309" />
                <stop offset="100%" stopColor="#78350f" />
              </radialGradient>
              <linearGradient id="rimGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stopColor="#fef3c7" />
                <stop offset="100%" stopColor="#92400e" />
              </linearGradient>
            </defs>
            <circle cx="50" cy="50" r="44" fill="url(#biscuitGrad)" stroke="url(#rimGrad)" strokeWidth="4" strokeDasharray="7 3.5" />
            <circle cx="50" cy="50" r="35" fill="none" stroke="#78350f" strokeWidth="1.8" strokeOpacity="0.6" />
            <circle cx="50" cy="50" r="32" fill="none" stroke="#fef3c7" strokeWidth="1" strokeOpacity="0.5" />
            <circle cx="50" cy="24" r="2.2" fill="#78350f" opacity="0.75" />
            <circle cx="36" cy="28" r="2" fill="#78350f" opacity="0.75" />
            <circle cx="64" cy="28" r="2" fill="#78350f" opacity="0.75" />
            <circle cx="50" cy="76" r="2.2" fill="#78350f" opacity="0.75" />
            <circle cx="36" cy="72" r="2" fill="#78350f" opacity="0.75" />
            <circle cx="64" cy="72" r="2" fill="#78350f" opacity="0.75" />
            <text x="50" y="57" textAnchor="middle" fontFamily="'Plus Jakarta Sans', Arial, sans-serif" fontWeight="900" fontSize="24" fill="#451a03" letterSpacing="1.5">
              DAN
            </text>
            <text x="50" y="56" textAnchor="middle" fontFamily="'Plus Jakarta Sans', Arial, sans-serif" fontWeight="900" fontSize="24" fill="#fef3c7" fillOpacity="0.35" letterSpacing="1.5">
              DAN
            </text>
          </svg>
        </div>
      );
    };

    function BakeryPOS() {
      const [userRole, setUserRole] = useState(null);
      const [loginRoleSelect, setLoginRoleSelect] = useState('manager');
      const [loginIdInput, setLoginIdInput] = useState('');
      const [pinInput, setPinInput] = useState('');
      const [showPin, setShowPin] = useState(false);
      const [loginError, setLoginError] = useState('');

      // Simple Security Key Forgot States
      const [showForgot, setShowForgot] = useState(false);
      const [keyRole, setKeyRole] = useState('manager');
      const [securityKeyInput, setSecurityKeyInput] = useState('');
      const [newPinInput, setNewPinInput] = useState('');
      const [keyError, setKeyError] = useState('');

      // Modern Toast Notification State
      const [toast, setToast] = useState(null);
      const toastTimerRef = useRef(null);

      const showNotify = (message, type = 'success') => {
        if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
        const titles = {
          success: 'Saved & Updated',
          error: 'Attention Required',
          info: 'System Update'
        };
        setToast({ message, type, title: titles[type] || 'Notification' });
        toastTimerRef.current = setTimeout(() => {
          setToast(null);
        }, 3500);
      };

      const [activeTab, setActiveTab] = useState('pos');
      const [settings, setSettings] = useState(() => getStore('bakery_settings', DEFAULT_SETTINGS));
      const [products, setProducts] = useState(() => getStore('bakery_products', initialProducts));
      const [sales, setSales] = useState(() => getStore('bakery_sales', []));
      const [expenses, setExpenses] = useState(() => getStore('bakery_expenses', []));
      const [khatas, setKhatas] = useState(() => getStore('bakery_khatas', []));

      const [selectedSalesmanId, setSelectedSalesmanId] = useState(null);
      const [newSalesman, setNewSalesman] = useState({ name: '', phone: '', route: '' });
      const [khataEntry, setKhataEntry] = useState({ type: 'payment', amount: '', note: '' });

      const [dashSalesmanModalId, setDashSalesmanModalId] = useState(null);
      const [khataPeriod, setKhataPeriod] = useState('weekly');

      const [posMode, setPosMode] = useState('retail');
      const [posSalesmanId, setPosSalesmanId] = useState('');
      const [cart, setCart] = useState([]);
      const [customerName, setCustomerName] = useState('');
      const [discount, setDiscount] = useState('');
      const [search, setSearch] = useState('');
      const [selectedCat, setSelectedCat] = useState('All');
      
      const [receipt, setReceipt] = useState(null);
      const [expForm, setExpForm] = useState({ title: '', amount: '', category: 'Raw Material' });

      const [editingProdId, setEditingProdId] = useState(null);
      const [prodForm, setProdForm] = useState({ name: '', category: 'Cakes', packingType: 'weight', sp1: '', sp2: '', wsSp1: '', wsSp2: '', reg1: '', reg2: '', wsReg1: '', wsReg2: '' });

      const [returnModalSale, setReturnModalSale] = useState(null);
      const [customRefundAmt, setCustomRefundAmt] = useState('');

      // Dynamic Title
      useEffect(() => {
        document.title = `${settings.name} — POS & Khata`;
      }, [settings.name]);

      // Auto-save LocalStorage
      useEffect(() => { localStorage.setItem('bakery_settings', JSON.stringify(settings)); }, [settings]);
      useEffect(() => { localStorage.setItem('bakery_products', JSON.stringify(products)); }, [products]);
      useEffect(() => { localStorage.setItem('bakery_sales', JSON.stringify(sales)); }, [sales]);
      useEffect(() => { localStorage.setItem('bakery_expenses', JSON.stringify(expenses)); }, [expenses]);
      useEffect(() => { localStorage.setItem('bakery_khatas', JSON.stringify(khatas)); }, [khatas]);

      // Keep posSalesmanId synced
      useEffect(() => {
        if (khatas.length === 0) {
          if (posSalesmanId) setPosSalesmanId('');
          return;
        }
        if (!khatas.some(k => k.id === posSalesmanId)) {
          setPosSalesmanId(khatas[0].id);
        }
      }, [khatas, posSalesmanId]);

      const isManager = userRole === 'manager';
      const isOwner = userRole === 'owner';

      const normalizePhone = (ph) => {
        let digits = (ph || '').replace(/[^0-9]/g, '');
        if (digits.startsWith('92') && digits.length === 12) digits = '0' + digits.slice(2);
        return digits;
      };

      // Simple Login (Accepts Username OR Phone Number + Password)
      const handleLogin = (e) => {
        e.preventDefault();
        setLoginError('');

        const enteredId = loginIdInput.trim().toLowerCase();
        const enteredDigits = normalizePhone(loginIdInput);
        const enteredPin = pinInput.trim();

        if (!enteredId || !enteredPin) {
          setLoginError('Username/Number aur Password dono likhein!');
          return;
        }

        if (loginRoleSelect === 'manager') {
          const validUser = (settings.managerUsername || 'tayyab').trim().toLowerCase();
          const validPhone = normalizePhone(settings.managerContact);
          const validPin = (settings.pin || '1234').trim();

          const idMatch = enteredId === validUser || (enteredDigits && enteredDigits === validPhone);
          if (idMatch && enteredPin === validPin) {
            setUserRole('manager');
            setActiveTab('pos');
            setLoginIdInput('');
            setPinInput('');
            showNotify('Manager Portal Unlocked!', 'success');
          } else {
            setLoginError('Manager Username/Number ya Password ghalat hai!');
          }
        } else {
          const validUser = (settings.ownerUsername || 'touseef').trim().toLowerCase();
          const validPhone = normalizePhone(settings.ownerContact);
          const validPin = (settings.ownerPin || '5555').trim();

          const idMatch = enteredId === validUser || (enteredDigits && enteredDigits === validPhone);
          if (idMatch && enteredPin === validPin) {
            setUserRole('owner');
            setActiveTab('dashboard');
            setLoginIdInput('');
            setPinInput('');
            showNotify('Owner Dashboard Opened!', 'success');
          } else {
            setLoginError('Owner Username/Number ya Password ghalat hai!');
          }
        }
      };

      // Instant Security Key Unlock & Reset
      const handleSecurityKeyUnlock = (e) => {
        e.preventDefault();
        setKeyError('');

        const enteredKey = securityKeyInput.trim();
        const validKey = keyRole === 'manager' 
          ? (settings.managerSecurityKey || 'DAN-MGR-99').trim() 
          : (settings.ownerSecurityKey || 'DAN-OWN-88').trim();

        if (!enteredKey || enteredKey !== validKey) {
          setKeyError('Security Key ghalat hai! Sahi Master Security Key lagayein.');
          return;
        }

        if (newPinInput.trim()) {
          if (keyRole === 'manager') {
            setSettings(prev => ({ ...prev, pin: newPinInput.trim() }));
          } else {
            setSettings(prev => ({ ...prev, ownerPin: newPinInput.trim() }));
          }
          showNotify('Password updated & system unlocked!', 'success');
        } else {
          showNotify('Security Key verified! System unlocked.', 'success');
        }

        setUserRole(keyRole);
        setActiveTab(keyRole === 'manager' ? 'pos' : 'dashboard');
        setShowForgot(false);
        setSecurityKeyInput('');
        setNewPinInput('');
        setKeyError('');
      };

      // POS Mode Switch
      const switchPosMode = (newMode) => {
        setPosMode(newMode);
        if (cart.length > 0) {
          const updatedCart = cart.map(item => {
            const prod = products.find(p => p.id === item.prodId);
            if (!prod) return item;
            let newPrice = item.price;
            if (item.quality === 'special') {
              newPrice = newMode === 'khata' 
                ? (item.option === '1' ? (prod.wsSp1 || prod.sp1) : (prod.wsSp2 || prod.sp2))
                : (item.option === '1' ? prod.sp1 : prod.sp2);
            } else {
              newPrice = newMode === 'khata'
                ? (item.option === '1' ? (prod.wsReg1 || prod.reg1) : (prod.wsReg2 || prod.reg2))
                : (item.option === '1' ? prod.reg1 : prod.reg2);
            }
            return { ...item, price: Number(newPrice) };
          });
          setCart(updatedCart);
        }
      };

      // Cart Actions
      const addToCart = (prod, quality, option) => {
        if (!isManager) return;
        const isWeight = prod.packingType === 'weight';
        const optText = isWeight ? (option === '1' ? '1kg' : '2kg') : (option === '1' ? '1 Pack' : '5 Pack');
        
        let price = 0;
        if (quality === 'special') {
          price = posMode === 'khata' 
            ? (option === '1' ? (prod.wsSp1 || prod.sp1) : (prod.wsSp2 || prod.sp2))
            : (option === '1' ? prod.sp1 : prod.sp2);
        } else {
          price = posMode === 'khata'
            ? (option === '1' ? (prod.wsReg1 || prod.reg1) : (prod.wsReg2 || prod.reg2))
            : (option === '1' ? prod.reg1 : prod.reg2);
        }

        const label = `${prod.name} (${quality === 'special' ? 'Spl' : 'Reg'} - ${optText})`;
        const cartId = `${prod.id}-${quality}-${option}`;
        
        const existing = cart.find(i => i.cartId === cartId);
        if (existing) { setCart(cart.map(i => i.cartId === cartId ? { ...i, qty: i.qty + 1 } : i)); } 
        else { setCart([...cart, { cartId, prodId: prod.id, quality, option, name: label, price: Number(price), qty: 1 }]); }
      };

      const updateQty = (cartId, delta) => {
        setCart(cart.map(i => {
          if (i.cartId === cartId) {
            const newQty = i.qty + delta;
            return newQty > 0 ? { ...i, qty: newQty } : null;
          }
          return i;
        }).filter(Boolean));
      };

      const removeFromCart = (cartId) => setCart(cart.filter(i => i.cartId !== cartId));

      const subtotal = cart.reduce((acc, i) => acc + (i.price * i.qty), 0);
      const discVal = Number(discount) || 0;
      const grandTotal = subtotal > discVal ? subtotal - discVal : 0;

      const getSalesmanStats = (sm) => {
        if (!sm || !Array.isArray(sm.transactions)) return { totalStock: 0, totalPaid: 0, balance: 0 };
        const totalStock = sm.transactions.filter(t => t.type === 'stock').reduce((a, b) => a + Number(b.amount || 0), 0);
        const totalPaid = sm.transactions.filter(t => t.type === 'payment').reduce((a, b) => a + Number(b.amount || 0), 0);
        return { totalStock, totalPaid, balance: totalStock - totalPaid };
      };

      const getTxDateObj = (tx) => {
        if (tx.timestamp) return new Date(tx.timestamp);
        if (tx.id && tx.id.startsWith('tx_')) {
          const ms = Number(tx.id.replace('tx_', ''));
          if (!isNaN(ms) && ms > 1000000000000) return new Date(ms);
        }
        const parsed = new Date(tx.date);
        return isNaN(parsed.getTime()) ? new Date() : parsed;
      };

      const getFilteredKhataStats = (sm, period) => {
        if (!sm || !Array.isArray(sm.transactions)) return { txs: [], stock: 0, paid: 0, netChange: 0 };
        const now = new Date();
        const txs = sm.transactions.filter(tx => {
          if (period === 'all') return true;
          const d = getTxDateObj(tx);
          if (period === 'weekly') {
            const sevenDaysAgo = new Date();
            sevenDaysAgo.setDate(now.getDate() - 7);
            sevenDaysAgo.setHours(0, 0, 0, 0);
            return d >= sevenDaysAgo;
          }
          if (period === 'monthly') {
            return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
          }
          if (period === 'yearly') {
            return d.getFullYear() === now.getFullYear();
          }
          return true;
        });

        const stock = txs.filter(t => t.type === 'stock').reduce((a, b) => a + Number(b.amount || 0), 0);
        const paid = txs.filter(t => t.type === 'payment').reduce((a, b) => a + Number(b.amount || 0), 0);
        return { txs, stock, paid, netChange: stock - paid };
      };

      const checkout = () => {
        if (!isManager || cart.length === 0) return;

        if (posMode === 'retail') {
          const orderId = 'ORD-' + Math.floor(1000 + Math.random() * 9000);
          const dateStr = new Date().toLocaleString();
          const cust = customerName.trim() || 'Walk-in Customer';

          const newSale = { 
            id: orderId, 
            date: dateStr, 
            customer: cust, 
            items: [...cart], 
            subtotal, 
            discount: discVal, 
            refundedAmount: 0,
            amount: grandTotal, 
            type: 'Retail' 
          };
          setSales([newSale, ...sales]);
          setReceipt(newSale);
          setCart([]); setCustomerName(''); setDiscount('');
          showNotify(`Retail Bill ${orderId} created!`, 'success');
          return;
        }

        if (posMode === 'khata') {
          const sm = khatas.find(k => k.id === posSalesmanId);
          if (!sm) {
            showNotify('Pehle Salesman select karein ya Khata tab mein add karein!', 'error');
            return;
          }

          const nowMs = Date.now();
          const itemsSummary = cart.map(i => `${i.name} x${i.qty}`).join(', ');
          const extraNote = customerName.trim() ? ` (${customerName.trim()})` : '';
          const tx = {
            id: 'tx_' + nowMs,
            timestamp: nowMs,
            date: new Date(nowMs).toLocaleString(),
            type: 'stock',
            amount: grandTotal,
            note: `${itemsSummary}${extraNote}`,
            items: [...cart]
          };

          const updatedKhatas = khatas.map(k => k.id === sm.id ? { ...k, transactions: [tx, ...(k.transactions || [])] } : k);
          setKhatas(updatedKhatas);

          const updatedSm = updatedKhatas.find(k => k.id === sm.id);
          const stats = getSalesmanStats(updatedSm);

          setReceipt({
            isKhataSlip: true,
            orderId: tx.id.slice(-6).toUpperCase(),
            date: tx.date,
            customer: sm.name,
            phone: sm.phone,
            txType: 'STOCK ISSUED (MAAL DIYA)',
            items: [...cart],
            discount: discVal,
            amount: grandTotal,
            previousBalance: stats.balance - grandTotal,
            newBalance: stats.balance
          });

          setCart([]); setCustomerName(''); setDiscount('');
          showNotify(`Stock added to ${sm.name}'s Khata!`, 'success');
        }
      };

      // Khata Management
      const handleAddSalesman = (e) => {
        e.preventDefault();
        if (!isManager) return;
        if (!newSalesman.name.trim()) {
          showNotify('Salesman ka naam likhna zaroori hai!', 'error');
          return;
        }
        const sm = {
          id: 'sm_' + Date.now(),
          name: newSalesman.name.trim(),
          phone: newSalesman.phone.trim(),
          route: newSalesman.route.trim(),
          transactions: []
        };
        setKhatas([sm, ...khatas]);
        setSelectedSalesmanId(sm.id);
        setPosSalesmanId(sm.id);
        setNewSalesman({ name: '', phone: '', route: '' });
        showNotify(`Salesman "${sm.name}" ka khata ban gaya!`, 'success');
      };

      const handleKhataTransaction = (e) => {
        e.preventDefault();
        if (!isManager) return;
        const sm = khatas.find(k => k.id === (selectedSalesmanId || (khatas[0] && khatas[0].id)));
        if (!sm) return;

        const finalAmt = Number(khataEntry.amount);
        if (!finalAmt || finalAmt <= 0) {
          showNotify('Sahi raqam (Amount) darj karein!', 'error');
          return;
        }

        const nowMs = Date.now();
        const autoNote = khataEntry.note.trim() || (khataEntry.type === 'stock' ? 'Direct Stock Entry' : 'Cash Received');

        const tx = {
          id: 'tx_' + nowMs,
          timestamp: nowMs,
          date: new Date(nowMs).toLocaleString(),
          type: khataEntry.type,
          amount: finalAmt,
          note: autoNote,
          items: []
        };

        const updatedKhatas = khatas.map(k => k.id === sm.id ? { ...k, transactions: [tx, ...(k.transactions || [])] } : k);
        setKhatas(updatedKhatas);

        if (khataEntry.type === 'payment') {
          const saleLog = {
            id: 'KHT-' + Math.floor(1000 + Math.random() * 9000),
            date: tx.date,
            customer: `${sm.name} (Khata Vasooli)`,
            items: [{ name: `Khata Cash Recovery - ${autoNote}`, price: finalAmt, qty: 1 }],
            subtotal: finalAmt,
            discount: 0,
            refundedAmount: 0,
            amount: finalAmt,
            type: 'Khata Cash'
          };
          setSales([saleLog, ...sales]);
        }

        const updatedSm = updatedKhatas.find(k => k.id === sm.id);
        const stats = getSalesmanStats(updatedSm);
        setReceipt({
          isKhataSlip: true,
          isDirectEntry: true,
          orderId: tx.id.slice(-6).toUpperCase(),
          date: tx.date,
          customer: sm.name,
          phone: sm.phone,
          txType: tx.type === 'stock' ? 'STOCK ISSUED (MAAL DIYA)' : 'CASH RECEIVED (VASOOLI)',
          items: [{ name: tx.note, price: tx.amount, qty: 1 }],
          amount: tx.amount,
          previousBalance: tx.type === 'stock' ? (stats.balance - tx.amount) : (stats.balance + tx.amount),
          newBalance: stats.balance
        });

        setKhataEntry({ type: 'payment', amount: '', note: '' });
        showNotify(tx.type === 'payment' ? 'Vasooli record ho gayi!' : 'Direct maal khata mein darj ho gaya!', 'success');
      };

      const deleteKhataTx = (smId, txId) => {
        if (!isManager) return;
        if (!window.confirm('Delete this Khata entry?')) return;
        setKhatas(khatas.map(k => k.id === smId ? { ...k, transactions: (k.transactions || []).filter(t => t.id !== txId) } : k));
        showNotify('Khata entry delete kar di gayi.', 'info');
      };

      const deleteSalesman = (smId) => {
        if (!isManager) return;
        if (!window.confirm('Delete this Salesman and entire Khata history permanently?')) return;
        const remaining = khatas.filter(k => k.id !== smId);
        setKhatas(remaining);
        if (selectedSalesmanId === smId) setSelectedSalesmanId(remaining[0]?.id || null);
        if (posSalesmanId === smId) setPosSalesmanId(remaining[0]?.id || '');
        if (dashSalesmanModalId === smId) setDashSalesmanModalId(null);
        showNotify('Salesman khata delete kar diya gaya.', 'info');
      };

      // Partial Return Modal
      const openReturnModal = (sale) => {
        if (!isManager) return;
        setReturnModalSale(JSON.parse(JSON.stringify(sale)));
        setCustomRefundAmt('');
      };

      const adjustReturnItemQty = (idx, delta) => {
        if (!returnModalSale || !returnModalSale.items) return;
        const updatedItems = [...returnModalSale.items];
        const newQty = updatedItems[idx].qty + delta;
        if (newQty <= 0) { updatedItems.splice(idx, 1); } 
        else { updatedItems[idx].qty = newQty; }
        const newSub = updatedItems.reduce((acc, i) => acc + (i.price * i.qty), 0);
        const newTotal = Math.max(0, newSub - (returnModalSale.discount || 0) - (returnModalSale.refundedAmount || 0));
        setReturnModalSale({ ...returnModalSale, items: updatedItems, subtotal: newSub, amount: newTotal });
      };

      const applyCustomRefund = () => {
        const refVal = Number(customRefundAmt);
        if (!refVal || refVal <= 0) {
          showNotify('Sahi return amount likhein!', 'error');
          return;
        }
        if (refVal > returnModalSale.amount) {
          showNotify('Return amount mojooda bill se zyada nahi ho sakti!', 'error');
          return;
        }
        const updatedRefunded = (returnModalSale.refundedAmount || 0) + refVal;
        const newTotal = returnModalSale.amount - refVal;
        setReturnModalSale({ ...returnModalSale, refundedAmount: updatedRefunded, amount: newTotal });
        setCustomRefundAmt('');
        showNotify(`Rs. ${refVal} deduct kar diya gaya.`, 'info');
      };

      const saveReturnChanges = () => {
        if (!returnModalSale || !isManager) return;
        if (returnModalSale.amount === 0 && (!returnModalSale.items || returnModalSale.items.length === 0)) {
          if (window.confirm('Bill total is 0. Remove this transaction completely?')) {
            setSales(sales.filter(s => s.id !== returnModalSale.id));
            setReturnModalSale(null);
            showNotify('Zero bill record remove kar diya gaya.', 'info');
            return;
          }
        }
        setSales(sales.map(s => s.id === returnModalSale.id ? returnModalSale : s));
        setReturnModalSale(null);
        showNotify('Return ke baad bill update ho gaya hai!', 'success');
      };

      const deleteRecord = (id, listType) => {
        if (!isManager) return;
        if(listType === 'sale' && window.confirm('Revert entire sale completely?')) { 
          setSales(sales.filter(s => s.id !== id)); 
          showNotify('Sale revert kar di gayi.', 'info');
        }
        if(listType === 'expense' && window.confirm('Delete this expense?')) { 
          setExpenses(expenses.filter(e => e.id !== id)); 
          showNotify('Expense delete kar diya gaya.', 'info');
        }
      };

      // Product Management
      const startEditProduct = (prod) => {
        if (!isManager) return;
        setEditingProdId(prod.id);
        setProdForm({
          name: prod.name, category: prod.category, packingType: prod.packingType,
          sp1: prod.sp1 || '', sp2: prod.sp2 || '', wsSp1: prod.wsSp1 || '', wsSp2: prod.wsSp2 || '',
          reg1: prod.reg1 || '', reg2: prod.reg2 || '', wsReg1: prod.wsReg1 || '', wsReg2: prod.wsReg2 || ''
        });
        window.scrollTo({ top: 300, behavior: 'smooth' });
      };

      const cancelEditProduct = () => {
        setEditingProdId(null);
        setProdForm({ name: '', category: 'Cakes', packingType: 'weight', sp1: '', sp2: '', wsSp1: '', wsSp2: '', reg1: '', reg2: '', wsReg1: '', wsReg2: '' });
      };

      const handleSaveProduct = (e) => {
        e.preventDefault();
        if (!isManager) return;
        if(!prodForm.name.trim()) {
          showNotify('Product ka naam likhna zaroori hai!', 'error');
          return;
        }
        const formattedItem = {
          id: editingProdId || 'prod_' + Date.now(),
          name: prodForm.name.trim(),
          category: prodForm.category.trim() || 'General',
          packingType: prodForm.packingType,
          sp1: Number(prodForm.sp1) || 0, sp2: Number(prodForm.sp2) || 0,
          wsSp1: Number(prodForm.wsSp1) || 0, wsSp2: Number(prodForm.wsSp2) || 0,
          reg1: Number(prodForm.reg1) || 0, reg2: Number(prodForm.reg2) || 0,
          wsReg1: Number(prodForm.wsReg1) || 0, wsReg2: Number(prodForm.wsReg2) || 0
        };
        if (editingProdId) {
          setProducts(products.map(p => p.id === editingProdId ? formattedItem : p));
          showNotify(`"${formattedItem.name}" ke rates update ho gaye!`, 'success');
        } else {
          setProducts([...products, formattedItem]);
          showNotify(`"${formattedItem.name}" menu mein shamil ho gaya!`, 'success');
        }
        cancelEditProduct();
      };

      // Analytics
      const totalSales = sales.reduce((a, b) => a + Number(b.amount || 0), 0);
      const totalExp = expenses.reduce((a, b) => a + Number(b.amount || 0), 0);
      const netProfit = totalSales - totalExp;
      const totalMarketBakaya = khatas.reduce((acc, sm) => acc + getSalesmanStats(sm).balance, 0);

      const categories = ['All', ...new Set(products.map(p => p.category))];
      const filteredProds = products.filter(p => (selectedCat === 'All' || p.category === selectedCat) && p.name.toLowerCase().includes(search.toLowerCase()));
      const activeSalesman = khatas.find(k => k.id === selectedSalesmanId) || khatas[0] || null;
      const activeSmStats = getSalesmanStats(activeSalesman);

      const modalSalesman = khatas.find(k => k.id === dashSalesmanModalId) || null;
      const modalOverallStats = getSalesmanStats(modalSalesman);
      const modalPeriodStats = getFilteredKhataStats(modalSalesman, khataPeriod);

      // Modern Floating Toast Component
      const ToastBanner = () => {
        if (!toast) return null;
        const styles = {
          success: {
            bg: 'bg-[#0B1120] border-emerald-500/60',
            badge: 'bg-emerald-500/20 text-emerald-400',
            icon: '✅',
            bar: 'bg-emerald-400'
          },
          error: {
            bg: 'bg-[#0B1120] border-rose-500/60',
            badge: 'bg-rose-500/20 text-rose-400',
            icon: '⚠️',
            bar: 'bg-rose-500'
          },
          info: {
            bg: 'bg-[#0B1120] border-amber-500/60',
            badge: 'bg-amber-500/20 text-amber-400',
            icon: '✨',
            bar: 'bg-amber-400'
          }
        }[toast.type] || {
          bg: 'bg-[#0B1120] border-amber-500/60',
          badge: 'bg-amber-500/20 text-amber-400',
          icon: '✨',
          bar: 'bg-amber-400'
        };

        return (
          <div className="fixed top-4 right-4 left-4 sm:left-auto sm:w-96 z-[100] toast-slide no-print">
            <div className={`${styles.bg} border backdrop-blur-xl text-white p-4 rounded-2xl shadow-2xl flex items-center gap-3.5 relative overflow-hidden`}>
              <div className={`w-10 h-10 rounded-xl ${styles.badge} flex items-center justify-center text-lg shrink-0`}>
                {styles.icon}
              </div>
              <div className="flex-1 min-w-0">
                <p className="text-[10px] font-extrabold uppercase tracking-widest text-slate-400">{toast.title}</p>
                <p className="text-xs sm:text-sm font-bold text-white leading-snug mt-0.5 break-words">{toast.message}</p>
              </div>
              <button onClick={() => setToast(null)} className="w-7 h-7 rounded-lg bg-white/10 hover:bg-white/20 text-slate-300 text-xs font-extrabold flex items-center justify-center shrink-0">
                ✕
              </button>
              <div className={`absolute bottom-0 left-0 h-1 w-full ${styles.bar}`}></div>
            </div>
          </div>
        );
      };

      // --- SIMPLE LOGIN & SECURITY KEY SCREEN ---
      if (!userRole) {
        return (
          <div className="min-h-screen bg-[#0B1120] flex items-center justify-center p-4 relative overflow-hidden">
            <ToastBanner />
            <div className="absolute -top-24 -left-24 w-96 h-96 bg-amber-500/20 rounded-full blur-3xl"></div>
            <div className="absolute -bottom-24 -right-24 w-96 h-96 bg-emerald-500/20 rounded-full blur-3xl"></div>

            <div className="bg-slate-900/90 backdrop-blur-2xl border border-slate-700/80 p-7 sm:p-9 rounded-[2.25rem] shadow-2xl w-full max-w-md text-center relative z-10">
              <div className="flex justify-center mb-3">
                <BrandLogo size="lg" customLogoUrl={settings.logoUrl} />
              </div>
              <h1 className="text-2xl sm:text-3xl font-extrabold text-white tracking-wider mb-1">{settings.name}</h1>
              <p className="text-[11px] text-amber-400 font-bold mb-6 uppercase tracking-[0.2em]">POS & Khata Management</p>

              {!showForgot ? (
                <div>
                  <div className="grid grid-cols-2 gap-2 bg-[#0B1120] p-1.5 rounded-2xl border border-slate-800 mb-6">
                    <button 
                      type="button" 
                      onClick={() => { setLoginRoleSelect('manager'); setLoginIdInput(''); setPinInput(''); setLoginError(''); }} 
                      className={`py-3 px-2 rounded-xl text-xs font-extrabold uppercase tracking-wider transition flex flex-col items-center gap-0.5 ${loginRoleSelect === 'manager' ? 'bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 shadow-lg' : 'text-slate-400 hover:text-white'}`}
                    >
                      <span>👨‍💼 Manager</span>
                      <span className={`text-[9px] font-bold ${loginRoleSelect === 'manager' ? 'text-slate-900/80' : 'text-slate-500'}`}>Full Control</span>
                    </button>
                    <button 
                      type="button" 
                      onClick={() => { setLoginRoleSelect('owner'); setLoginIdInput(''); setPinInput(''); setLoginError(''); }} 
                      className={`py-3 px-2 rounded-xl text-xs font-extrabold uppercase tracking-wider transition flex flex-col items-center gap-0.5 ${loginRoleSelect === 'owner' ? 'bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-950 shadow-lg' : 'text-slate-400 hover:text-white'}`}
                    >
                      <span>👑 Owner</span>
                      <span className={`text-[9px] font-bold ${loginRoleSelect === 'owner' ? 'text-slate-900/80' : 'text-slate-500'}`}>Hisab View Only</span>
                    </button>
                  </div>

                  <form onSubmit={handleLogin} className="space-y-4 fade-in text-left">
                    <div>
                      <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest block mb-1.5 ml-1">
                        Username ya Mobile Number
                      </label>
                      <input 
                        type="text" 
                        placeholder="e.g. tony ya 0300-1234567" 
                        value={loginIdInput} 
                        onChange={e => setLoginIdInput(e.target.value)} 
                        className="w-full px-4 py-3.5 bg-[#0B1120] border border-slate-700 rounded-2xl text-sm font-bold text-white focus:outline-none focus:border-amber-400 transition placeholder:text-slate-600" 
                        autoFocus 
                      />
                    </div>

                    <div>
                      <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest block mb-1.5 ml-1">
                        Password / PIN
                      </label>
                      <div className="relative">
                        <input 
                          type={showPin ? "text" : "password"} 
                          placeholder="••••" 
                          value={pinInput} 
                          onChange={e => setPinInput(e.target.value)} 
                          className="w-full px-4 py-3.5 bg-[#0B1120] border border-slate-700 rounded-2xl text-lg font-extrabold text-white tracking-[0.35em] focus:outline-none focus:border-amber-400 transition placeholder:text-slate-600" 
                        />
                        <button 
                          type="button" 
                          onClick={() => setShowPin(!showPin)} 
                          className="absolute right-3.5 top-1/2 -translate-y-1/2 text-xs font-extrabold text-slate-400 hover:text-amber-400"
                        >
                          {showPin ? 'HIDE' : 'SHOW'}
                        </button>
                      </div>
                    </div>

                    {loginError && (
                      <div className="p-3 bg-rose-500/15 border border-rose-500/40 rounded-xl text-xs font-bold text-rose-300 text-center">
                        ⚠️ {loginError}
                      </div>
                    )}

                    <button 
                      type="submit" 
                      className={`w-full font-extrabold tracking-widest uppercase py-4 rounded-2xl shadow-lg transition text-slate-950 ${loginRoleSelect === 'manager' ? 'bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-300 hover:to-orange-400' : 'bg-gradient-to-r from-emerald-400 to-teal-500 hover:from-emerald-300 hover:to-teal-400'}`}
                    >
                      Login ({loginRoleSelect === 'manager' ? 'Manager' : 'Owner'})
                    </button>

                    <button 
                      type="button" 
                      onClick={() => { 
                        setKeyRole(loginRoleSelect); 
                        setSecurityKeyInput(''); 
                        setNewPinInput(''); 
                        setKeyError(''); 
                        setShowForgot(true); 
                      }} 
                      className="text-xs text-slate-400 hover:text-amber-400 mt-2 block w-full text-center font-semibold"
                    >
                      🔑 Password bhool gaye? Security Key lagayein
                    </button>
                  </form>
                </div>
              ) : (
                <form onSubmit={handleSecurityKeyUnlock} className="space-y-4 fade-in text-left">
                  <div className="bg-amber-500/10 border border-amber-500/30 p-3.5 rounded-2xl text-center">
                    <span className="text-xs font-extrabold text-amber-400 uppercase tracking-wider block">🔑 Master Security Key Unlock</span>
                    <span className="text-[10px] text-slate-300 block mt-0.5">Security Key lagayein aur foran andar jakar hisab dekhein</span>
                  </div>

                  <div className="grid grid-cols-2 gap-2 bg-[#0B1120] p-1.5 rounded-xl border border-slate-800">
                    <button 
                      type="button" 
                      onClick={() => { setKeyRole('manager'); setKeyError(''); }} 
                      className={`py-2.5 rounded-lg text-xs font-extrabold transition ${keyRole === 'manager' ? 'bg-amber-500 text-slate-950' : 'text-slate-400 hover:text-white'}`}
                    >
                      👨‍💼 Manager
                    </button>
                    <button 
                      type="button" 
                      onClick={() => { setKeyRole('owner'); setKeyError(''); }} 
                      className={`py-2.5 rounded-lg text-xs font-extrabold transition ${keyRole === 'owner' ? 'bg-emerald-500 text-slate-950' : 'text-slate-400 hover:text-white'}`}
                    >
                      👑 Owner
                    </button>
                  </div>

                  <div>
                    <label className="text-[10px] font-extrabold text-amber-400 uppercase tracking-widest block mb-1.5">
                      Enter {keyRole === 'manager' ? 'Manager' : 'Owner'} Security Key
                    </label>
                    <input 
                      type="text" 
                      placeholder="e.g. KEY-12345" 
                      value={securityKeyInput} 
                      onChange={e => setSecurityKeyInput(e.target.value)} 
                      className="w-full p-3.5 bg-[#0B1120] border border-slate-700 rounded-2xl text-sm font-extrabold text-white text-center tracking-widest focus:outline-none focus:border-amber-400" 
                      autoFocus 
                    />
                  </div>

                  <div>
                    <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest block mb-1.5">
                      New Password Set Karein (Optional)
                    </label>
                    <input 
                      type="text" 
                      placeholder="Khali chhor dein agar purana rakhna ho" 
                      value={newPinInput} 
                      onChange={e => setNewPinInput(e.target.value)} 
                      className="w-full p-3 bg-[#0B1120] border border-slate-700 rounded-xl text-xs font-bold text-white text-center focus:outline-none focus:border-emerald-400" 
                    />
                  </div>

                  {keyError && (
                    <div className="p-2.5 bg-rose-500/15 border border-rose-500/40 rounded-xl text-xs font-bold text-rose-300 text-center">
                      ⚠️ {keyError}
                    </div>
                  )}

                  <button type="submit" className="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold tracking-widest uppercase py-3.5 rounded-2xl shadow-lg transition text-xs">
                    🔓 Unlock & Open System
                  </button>

                  <button type="button" onClick={() => setShowForgot(false)} className="text-xs text-slate-400 hover:text-white block w-full text-center pt-1">
                    ← Back to Login
                  </button>
                </form>
              )}
            </div>
          </div>
        );
      }

      const NavItem = ({ id, icon, label }) => (
        <button onClick={() => setActiveTab(id)} className={`flex flex-col md:flex-row items-center gap-1 md:gap-3 p-2 md:px-4 md:py-3.5 w-full rounded-2xl transition-all ${activeTab === id ? 'bg-gradient-to-r from-amber-400 to-amber-500 text-slate-950 shadow-lg shadow-amber-500/20 font-extrabold' : 'text-slate-400 hover:bg-slate-800/80 hover:text-white font-bold'}`}>
          <span className="text-xl">{icon}</span><span className="text-[10px] md:text-sm tracking-wide">{label}</span>
        </button>
      );

      return (
        <div className="min-h-screen flex flex-col md:flex-row bg-[#f3f6fa]">
          <ToastBanner />
          
          {/* Desktop Sidebar */}
          <aside className="hidden md:flex flex-col w-68 bg-[#0B1120] h-screen sticky top-0 border-r border-slate-800 p-5 shrink-0 z-40">
            <div className="mb-8 px-1 border-b border-slate-800/80 pb-5 flex items-center gap-3.5">
              <BrandLogo size="md" customLogoUrl={settings.logoUrl} />
              <div className="min-w-0">
                <h1 className="text-lg font-extrabold text-white tracking-wider leading-tight truncate">{settings.name}</h1>
                <span className={`inline-block mt-1 px-2 py-0.5 rounded-md text-[9px] font-extrabold uppercase tracking-widest ${isManager ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' : 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'}`}>
                  {isManager ? `👨‍💼 ${settings.managerUsername || 'tony'}` : `👑 ${settings.ownerUsername || 'admin'} (View)`}
                </span>
              </div>
            </div>

            <nav className="flex-1 space-y-2">
              {isManager && <NavItem id="pos" icon="🛒" label="POS & Stock Issue" />}
              {isManager && <NavItem id="khata" icon="📒" label="Salesman Khata" />}
              <NavItem id="dashboard" icon="📈" label="Dashboard & Hisab" />
              <NavItem id="expenses" icon="💵" label={isManager ? "Expenses" : "Expenses View"} />
              {isManager && <NavItem id="settings" icon="⚙️" label="Settings & Security" />}
            </nav>

            <button onClick={() => setUserRole(null)} className="mt-auto bg-slate-800/90 text-slate-300 hover:bg-rose-600 hover:text-white py-4 rounded-2xl font-extrabold tracking-widest transition shadow-lg text-xs">
              🔒 LOCK / LOGOUT
            </button>
          </aside>

          {/* Main Area */}
          <main className="flex-1 w-full p-3 md:p-6 pb-28 md:pb-6 overflow-y-auto">
            
            {/* Mobile Header */}
            <div className="md:hidden flex justify-between items-center bg-[#0B1120] p-3.5 rounded-3xl mb-4 shadow-lg text-white border border-slate-800">
              <div className="flex items-center gap-3 min-w-0">
                <BrandLogo size="sm" customLogoUrl={settings.logoUrl} />
                <div className="min-w-0">
                  <h1 className="text-sm font-extrabold truncate tracking-wide">{settings.name}</h1>
                  <span className={`text-[9px] font-extrabold uppercase tracking-widest ${isManager ? 'text-amber-400' : 'text-emerald-400'}`}>
                    {isManager ? `Manager: ${settings.managerUsername || 'tony'}` : `Owner: ${settings.ownerUsername || 'admin'} (View)`}
                  </span>
                </div>
              </div>
              <button onClick={() => setUserRole(null)} className="bg-slate-800 border border-slate-700 px-3.5 py-2 rounded-xl text-[11px] font-extrabold hover:bg-rose-600 transition shrink-0">
                Lock
              </button>
            </div>

            {isOwner && (
              <div className="mb-5 bg-gradient-to-r from-emerald-900 to-teal-900 text-white p-4 rounded-2xl shadow-md flex flex-wrap justify-between items-center gap-2 border border-emerald-700/50">
                <div className="flex items-center gap-2.5">
                  <span className="text-xl">👑</span>
                  <div>
                    <p className="text-xs font-extrabold uppercase tracking-wider text-emerald-300">Owner View Mode ({settings.ownerUsername})</p>
                    <p className="text-[11px] text-emerald-100/90">Aap tamam Sales, Salesman Khata (Weekly/Monthly/Yearly) aur Expenses ka hisab dekh sakte hain.</p>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 1: POS */}
            {activeTab === 'pos' && isManager && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start fade-in">
                
                <div className="lg:col-span-7 xl:col-span-8 space-y-4">
                  <div className="bg-white p-2.5 rounded-3xl shadow-sm border border-slate-200 flex flex-col sm:flex-row justify-between items-center gap-2">
                    <div className="flex overflow-x-auto hide-scroll w-full gap-2 p-1">
                      {categories.map(c => (
                        <button key={c} onClick={() => setSelectedCat(c)} className={`px-4 py-2.5 rounded-2xl text-xs font-extrabold uppercase tracking-wider whitespace-nowrap transition ${selectedCat===c ? (posMode==='khata'?'bg-rose-600 text-white shadow':'bg-[#0B1120] text-amber-400 shadow') : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>{c}</button>
                      ))}
                    </div>
                    <input type="text" placeholder="🔍 Search item..." value={search} onChange={e => setSearch(e.target.value)} className="w-full sm:w-56 p-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-medium focus:outline-none focus:border-amber-400 shrink-0" />
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">
                    {filteredProds.map(p => {
                      const sp1Rate = posMode === 'khata' ? (p.wsSp1 || p.sp1) : p.sp1;
                      const sp2Rate = posMode === 'khata' ? (p.wsSp2 || p.sp2) : p.sp2;
                      const reg1Rate = posMode === 'khata' ? (p.wsReg1 || p.reg1) : p.reg1;
                      const reg2Rate = posMode === 'khata' ? (p.wsReg2 || p.reg2) : p.reg2;

                      return (
                        <div key={p.id} className="bg-white p-4 sm:p-5 rounded-3xl shadow-sm border border-slate-200/80 flex flex-col justify-between hover:shadow-md transition">
                          <div className="mb-3 flex justify-between items-start gap-2">
                            <div className="min-w-0">
                              <h3 className="font-extrabold text-slate-900 text-base leading-snug break-words mb-1">{p.name}</h3>
                              <span className={`text-[9px] font-extrabold uppercase tracking-widest px-2.5 py-0.5 rounded-lg inline-block ${posMode==='khata'?'bg-rose-100 text-rose-700':'bg-amber-100 text-amber-800'}`}>{p.category}</span>
                            </div>
                            {posMode === 'khata' && <span className="text-[9px] font-extrabold bg-[#0B1120] text-amber-400 px-2 py-0.5 rounded uppercase shrink-0">Khata Rate</span>}
                          </div>
                          
                          <div className="space-y-2.5 mt-auto">
                            <div className={`p-2.5 rounded-2xl border ${posMode==='khata'?'bg-rose-50/70 border-rose-100':'bg-amber-50/80 border-amber-200/70'}`}>
                              <span className="text-[10px] font-extrabold text-slate-600 block mb-1.5 tracking-widest">🌟 SPECIAL</span>
                              <div className="grid grid-cols-2 gap-2">
                                <button onClick={() => addToCart(p, 'special', '1')} className={`py-2 px-1 rounded-xl text-xs font-extrabold shadow-sm transition ${posMode==='khata'?'bg-rose-600 text-white hover:bg-rose-700':'bg-white border border-amber-300 text-slate-900 hover:bg-amber-400'}`}>
                                  {p.packingType==='weight'?'1kg':'1 Pk'}<br/><span className="text-[10px] opacity-90">Rs.{sp1Rate}</span>
                                </button>
                                <button onClick={() => addToCart(p, 'special', '2')} className={`py-2 px-1 rounded-xl text-xs font-extrabold shadow-sm transition ${posMode==='khata'?'bg-rose-600 text-white hover:bg-rose-700':'bg-white border border-amber-300 text-slate-900 hover:bg-amber-400'}`}>
                                  {p.packingType==='weight'?'2kg':'5 Pk'}<br/><span className="text-[10px] opacity-90">Rs.{sp2Rate}</span>
                                </button>
                              </div>
                            </div>
                            <div className="p-2.5 rounded-2xl bg-slate-50 border border-slate-200/70">
                              <span className="text-[10px] font-extrabold text-slate-400 block mb-1.5 tracking-widest">⭐ REGULAR</span>
                              <div className="grid grid-cols-2 gap-2">
                                <button onClick={() => addToCart(p, 'regular', '1')} className="bg-white border border-slate-200 text-slate-700 hover:bg-slate-100 py-2 px-1 rounded-xl text-xs font-bold shadow-sm">
                                  {p.packingType==='weight'?'1kg':'1 Pk'}<br/><span className="text-[10px] text-slate-500">Rs.{reg1Rate}</span>
                                </button>
                                <button onClick={() => addToCart(p, 'regular', '2')} className="bg-white border border-slate-200 text-slate-700 hover:bg-slate-100 py-2 px-1 rounded-xl text-xs font-bold shadow-sm">
                                  {p.packingType==='weight'?'2kg':'5 Pk'}<br/><span className="text-[10px] text-slate-500">Rs.{reg2Rate}</span>
                                </button>
                              </div>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Live Cart */}
                <div className="lg:col-span-5 xl:col-span-4 lg:sticky lg:top-4">
                  <div className={`bg-white p-4 sm:p-5 rounded-[2rem] shadow-xl border-2 flex flex-col justify-between lg:max-h-[calc(100vh-2rem)] transition-colors ${posMode==='khata'?'border-rose-300':'border-amber-300'}`}>
                    
                    <div className="space-y-3 shrink-0">
                      <div className="grid grid-cols-2 gap-1.5 bg-slate-100 p-1.5 rounded-2xl">
                        <button type="button" onClick={() => switchPosMode('retail')} className={`py-2.5 px-2 rounded-xl text-[11px] font-extrabold uppercase tracking-wider transition ${posMode==='retail'?'bg-[#0B1120] text-amber-400 shadow':'text-slate-500 hover:text-slate-800'}`}>
                          🛒 Retail Cash
                        </button>
                        <button type="button" onClick={() => switchPosMode('khata')} className={`py-2.5 px-2 rounded-xl text-[11px] font-extrabold uppercase tracking-wider transition ${posMode==='khata'?'bg-rose-600 text-white shadow':'text-slate-500 hover:text-slate-800'}`}>
                          📒 Salesman Khata
                        </button>
                      </div>

                      {posMode === 'retail' ? (
                        <input type="text" placeholder="Customer Name (Optional)" value={customerName} onChange={e=>setCustomerName(e.target.value)} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold focus:outline-none focus:bg-white transition" />
                      ) : (
                        <div className="space-y-2 bg-rose-50 p-3 rounded-2xl border border-rose-200">
                          <div className="flex justify-between items-center gap-2">
                            <label className="text-[10px] font-extrabold text-rose-700 uppercase tracking-wider">Select Salesman</label>
                            <button type="button" onClick={() => setActiveTab('khata')} className="text-[10px] font-extrabold text-indigo-600 underline shrink-0">+ New Salesman</button>
                          </div>
                          {khatas.length === 0 ? (
                            <button type="button" onClick={() => setActiveTab('khata')} className="w-full py-2.5 bg-white border border-rose-300 text-rose-700 rounded-xl text-xs font-extrabold">
                              No Salesman — Click to Add
                            </button>
                          ) : (
                            <select value={posSalesmanId} onChange={e => setPosSalesmanId(e.target.value)} className="w-full p-2.5 bg-white border border-rose-200 rounded-xl text-xs sm:text-sm font-extrabold text-slate-800 focus:outline-none">
                              {khatas.map(sm => {
                                const st = getSalesmanStats(sm);
                                return (
                                  <option key={sm.id} value={sm.id}>
                                    {sm.name} (Bakaya: Rs. {st.balance.toLocaleString()})
                                  </option>
                                );
                              })}
                            </select>
                          )}
                          <input type="text" placeholder="Note / Gatepass (Optional)" value={customerName} onChange={e=>setCustomerName(e.target.value)} className="w-full p-2.5 bg-white border border-rose-100 rounded-xl text-xs font-bold focus:outline-none" />
                        </div>
                      )}
                    </div>
                    
                    <div className="my-3 overflow-y-auto flex-1 min-h-[120px] max-h-[280px] lg:max-h-none divide-y divide-slate-100 pr-1">
                      {cart.length === 0 ? (
                        <div className="py-8 text-center text-slate-400 font-bold flex flex-col items-center justify-center">
                          <span className="text-3xl mb-1.5 opacity-60">{posMode==='khata'?'📦':'🛍️'}</span> 
                          <span className="text-xs">{posMode==='khata' ? 'Select items for Salesman' : 'Cart is empty'}</span>
                        </div>
                      ) : cart.map(i => (
                        <div key={i.cartId} className="py-2.5 flex justify-between items-center gap-2">
                          <div className="flex-1 min-w-0">
                            <p className="font-extrabold text-slate-800 text-xs truncate">{i.name}</p>
                            <p className="text-[10px] text-slate-400 font-bold mt-0.5">Rs.{i.price} each</p>
                          </div>
                          <div className="flex items-center gap-1 shrink-0">
                            <button onClick={() => updateQty(i.cartId, -1)} className="w-6 h-6 rounded-lg bg-slate-100 text-slate-700 font-extrabold hover:bg-slate-200">-</button>
                            <span className="text-xs font-extrabold w-5 text-center">{i.qty}</span>
                            <button onClick={() => updateQty(i.cartId, 1)} className="w-6 h-6 rounded-lg bg-slate-100 text-slate-700 font-extrabold hover:bg-slate-200">+</button>
                            <span className="font-extrabold text-slate-700 text-xs w-14 text-right">Rs.{i.price * i.qty}</span>
                            <button onClick={() => removeFromCart(i.cartId)} className="w-6 h-6 rounded-lg bg-red-50 text-red-500 flex items-center justify-center hover:bg-red-500 hover:text-white transition text-xs font-bold ml-0.5">✕</button>
                          </div>
                        </div>
                      ))}
                    </div>
                    
                    <div className="pt-3 border-t border-slate-200 shrink-0 space-y-3 bg-white">
                      <div className="flex justify-between items-center bg-slate-50 p-2 rounded-2xl border border-slate-100">
                        <span className="text-[11px] font-extrabold text-slate-400 uppercase tracking-wider px-2">Discount</span>
                        <input type="number" placeholder="0" value={discount} onChange={e=>setDiscount(e.target.value)} className="w-24 p-1.5 text-right bg-white border border-slate-200 rounded-xl text-sm font-extrabold focus:outline-none"/>
                      </div>
                      <div className="flex justify-between items-center px-1">
                        <span className="font-extrabold text-slate-500 uppercase tracking-wider text-xs">
                          {posMode==='khata' ? 'Stock Value' : 'Grand Total'}
                        </span>
                        <span className={`text-2xl sm:text-3xl font-extrabold tracking-tight ${posMode==='khata'?'text-rose-600':'text-amber-600'}`}>Rs. {grandTotal.toLocaleString()}</span>
                      </div>
                      <button onClick={checkout} disabled={cart.length===0} className={`w-full font-extrabold py-3.5 sm:py-4 rounded-2xl uppercase tracking-wider text-xs transition shadow-lg disabled:opacity-50 ${posMode==='khata'?'bg-rose-600 hover:bg-rose-700 text-white shadow-rose-500/30':'bg-[#0B1120] hover:bg-slate-800 text-amber-400 shadow-slate-900/30'}`}>
                        {posMode==='khata' ? '📒 Add To Khata & Print Slip' : '🖨️ Print Retail Invoice'}
                      </button>
                    </div>

                  </div>
                </div>
              </div>
            )}

            {/* TAB 2: SALESMAN KHATA */}
            {activeTab === 'khata' && isManager && (
              <div className="space-y-6 fade-in">
                <div className="bg-[#0B1120] text-white p-6 rounded-[2rem] shadow-xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border border-slate-800">
                  <div>
                    <p className="text-[10px] font-extrabold text-amber-400 uppercase tracking-widest">Salesman Ledger & Recovery</p>
                    <h2 className="text-2xl font-extrabold mt-0.5">📒 Salesman Khata & Bakaya</h2>
                  </div>
                  <div className="bg-white/10 px-5 py-3 rounded-2xl border border-white/10">
                    <span className="text-[10px] text-slate-300 font-bold uppercase block">Total Market Bakaya</span>
                    <span className="text-2xl font-extrabold text-rose-400">Rs. {totalMarketBakaya.toLocaleString()}</span>
                  </div>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                  <div className="space-y-6">
                    <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                      <h3 className="font-extrabold text-base mb-4">➕ Add New Salesman</h3>
                      <form onSubmit={handleAddSalesman} className="space-y-3">
                        <input type="text" placeholder="Salesman Name (e.g. Tony)" value={newSalesman.name} onChange={e=>setNewSalesman({...newSalesman, name: e.target.value})} className="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold focus:outline-none" />
                        <div className="grid grid-cols-2 gap-2">
                          <input type="text" placeholder="Phone Number" value={newSalesman.phone} onChange={e=>setNewSalesman({...newSalesman, phone: e.target.value})} className="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-bold focus:outline-none" />
                          <input type="text" placeholder="Area / Route" value={newSalesman.route} onChange={e=>setNewSalesman({...newSalesman, route: e.target.value})} className="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-bold focus:outline-none" />
                        </div>
                        <button type="submit" className="w-full bg-[#0B1120] hover:bg-slate-800 text-amber-400 font-extrabold py-3.5 rounded-2xl text-xs uppercase tracking-widest transition">Create Khata</button>
                      </form>
                    </div>

                    <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                      <h3 className="font-extrabold text-base mb-4">Active Salesmen ({khatas.length})</h3>
                      {khatas.length === 0 ? (
                        <p className="text-xs text-slate-400 font-bold text-center py-6">No salesman added yet.</p>
                      ) : (
                        <div className="space-y-2.5 max-h-[380px] overflow-y-auto pr-1">
                          {khatas.map(sm => {
                            const st = getSalesmanStats(sm);
                            const isSelected = activeSalesman && activeSalesman.id === sm.id;
                            return (
                              <div key={sm.id} onClick={() => setSelectedSalesmanId(sm.id)} className={`p-4 rounded-2xl border cursor-pointer transition flex justify-between items-center ${isSelected ? 'bg-amber-50 border-amber-400 shadow-sm' : 'bg-slate-50 border-slate-100 hover:bg-slate-100'}`}>
                                <div>
                                  <p className="font-extrabold text-slate-800 text-sm">{sm.name}</p>
                                  <p className="text-[10px] text-slate-500 font-bold">{sm.phone || 'No phone'} {sm.route ? `• ${sm.route}` : ''}</p>
                                </div>
                                <div className="text-right">
                                  <span className="text-[9px] font-extrabold uppercase text-slate-400 block">Bakaya</span>
                                  <span className={`font-extrabold text-sm ${st.balance > 0 ? 'text-rose-600' : 'text-emerald-600'}`}>Rs. {st.balance.toLocaleString()}</span>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  </div>

                  <div className="lg:col-span-2">
                    {!activeSalesman ? (
                      <div className="bg-white p-12 rounded-3xl border border-slate-200 text-center space-y-3">
                        <span className="text-5xl block">📒</span>
                        <h3 className="font-extrabold text-xl text-slate-700">Select or Add a Salesman</h3>
                        <p className="text-xs text-slate-400 font-medium max-w-md mx-auto">Subha ka saman POS screen se Salesman Khata mode mein add karein, aur sham ki cash vasooli (partial ya full) yahan record karein.</p>
                      </div>
                    ) : (
                      <div className="space-y-6">
                        <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                          <div className="flex flex-wrap justify-between items-center gap-3 border-b border-slate-100 pb-4 mb-5">
                            <div>
                              <h3 className="font-extrabold text-2xl text-slate-900">{activeSalesman.name}</h3>
                              <p className="text-xs font-bold text-slate-400">{activeSalesman.phone} {activeSalesman.route && `| Route: ${activeSalesman.route}`}</p>
                            </div>
                            <div className="flex flex-wrap gap-2">
                              <button onClick={() => { setDashSalesmanModalId(activeSalesman.id); setKhataPeriod('weekly'); }} className="text-[10px] font-extrabold uppercase tracking-widest bg-indigo-50 text-indigo-700 border border-indigo-200 px-3.5 py-2 rounded-xl hover:bg-indigo-600 hover:text-white transition">
                                📊 Weekly / Monthly Report
                              </button>
                              <button onClick={() => { setPosSalesmanId(activeSalesman.id); switchPosMode('khata'); setActiveTab('pos'); }} className="text-[10px] font-extrabold uppercase tracking-widest bg-amber-400 text-slate-950 px-3.5 py-2 rounded-xl hover:bg-amber-300 transition">
                                + Issue Stock
                              </button>
                              <button onClick={() => deleteSalesman(activeSalesman.id)} className="text-[10px] font-bold uppercase tracking-widest bg-red-50 text-red-500 px-3 py-2 rounded-xl hover:bg-red-500 hover:text-white transition">Delete</button>
                            </div>
                          </div>

                          <div className="grid grid-cols-3 gap-3 sm:gap-4">
                            <div className="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                              <span className="text-[9px] sm:text-[10px] font-extrabold text-slate-400 uppercase block">Total Maal Liya</span>
                              <span className="text-base sm:text-xl font-extrabold text-slate-800 mt-1 block">Rs. {activeSmStats.totalStock.toLocaleString()}</span>
                            </div>
                            <div className="bg-emerald-50 p-4 rounded-2xl border border-emerald-100">
                              <span className="text-[9px] sm:text-[10px] font-extrabold text-emerald-600 uppercase block">Total Vasool (Paid)</span>
                              <span className="text-base sm:text-xl font-extrabold text-emerald-700 mt-1 block">Rs. {activeSmStats.totalPaid.toLocaleString()}</span>
                            </div>
                            <div className={`p-4 rounded-2xl border ${activeSmStats.balance > 0 ? 'bg-rose-50 border-rose-200' : 'bg-[#0B1120] text-white border-slate-800'}`}>
                              <span className={`text-[9px] sm:text-[10px] font-extrabold uppercase block ${activeSmStats.balance > 0 ? 'text-rose-600' : 'text-amber-400'}`}>Bakaya (Remaining)</span>
                              <span className={`text-base sm:text-xl font-extrabold mt-1 block ${activeSmStats.balance > 0 ? 'text-rose-600' : 'text-white'}`}>Rs. {activeSmStats.balance.toLocaleString()}</span>
                            </div>
                          </div>
                        </div>

                        <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                          <div className="flex gap-2 mb-5">
                            <button type="button" onClick={() => setKhataEntry({...khataEntry, type: 'payment'})} className={`flex-1 py-3.5 rounded-2xl font-extrabold text-xs uppercase tracking-wider transition ${khataEntry.type === 'payment' ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-500/30' : 'bg-slate-100 text-slate-500'}`}>
                              💵 Sham Payment Vasool (Credit)
                            </button>
                            <button type="button" onClick={() => setKhataEntry({...khataEntry, type: 'stock'})} className={`flex-1 py-3.5 rounded-2xl font-extrabold text-xs uppercase tracking-wider transition ${khataEntry.type === 'stock' ? 'bg-rose-600 text-white shadow-lg shadow-rose-500/30' : 'bg-slate-100 text-slate-500'}`}>
                              📦 Direct Amount Maal (Debit)
                            </button>
                          </div>

                          <form onSubmit={handleKhataTransaction} className="space-y-4">
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                              <div>
                                <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest block mb-1.5">
                                  {khataEntry.type === 'payment' ? 'Vasool Shuda Cash (Partial / Full Rs)' : 'Maal Ki Qeemat (Rs)'}
                                </label>
                                <input type="number" placeholder="e.g. 5000" value={khataEntry.amount} onChange={e=>setKhataEntry({...khataEntry, amount: e.target.value})} className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl text-base font-extrabold focus:outline-none" />
                              </div>
                              <div>
                                <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest block mb-1.5">Detail / Note (Optional)</label>
                                <input type="text" placeholder={khataEntry.type === 'payment' ? 'e.g. Evening cash return' : 'e.g. Direct stock amount'} value={khataEntry.note} onChange={e=>setKhataEntry({...khataEntry, note: e.target.value})} className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold focus:outline-none" />
                              </div>
                            </div>

                            {khataEntry.type === 'payment' && activeSmStats.balance > 0 && (
                              <div className="flex flex-wrap gap-2">
                                <button type="button" onClick={() => setKhataEntry({...khataEntry, amount: activeSmStats.balance})} className="text-[10px] font-extrabold bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1.5 rounded-xl">
                                  Full Clear (Rs. {activeSmStats.balance})
                                </button>
                                <button type="button" onClick={() => setKhataEntry({...khataEntry, amount: Math.round(activeSmStats.balance / 2)})} className="text-[10px] font-extrabold bg-slate-100 text-slate-600 px-3 py-1.5 rounded-xl">
                                  Half Pay (Rs. {Math.round(activeSmStats.balance / 2)})
                                </button>
                              </div>
                            )}

                            <button type="submit" className={`w-full text-white font-extrabold py-4 rounded-2xl uppercase tracking-widest text-xs transition shadow-lg ${khataEntry.type === 'payment' ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-rose-600 hover:bg-rose-700'}`}>
                              {khataEntry.type === 'payment' ? 'Receive Payment & Print Slip' : 'Add Direct Amount & Print Slip'}
                            </button>
                          </form>
                        </div>

                        <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                          <h4 className="font-extrabold text-base mb-4">Khata History ({activeSalesman.name})</h4>
                          <div className="overflow-x-auto hide-scroll">
                            <table className="w-full text-left text-xs whitespace-nowrap min-w-[550px]">
                              <thead className="text-[10px] font-extrabold uppercase text-slate-400 border-b">
                                <tr>
                                  <th className="pb-3 px-2">Date / Time</th>
                                  <th className="pb-3 px-2">Type</th>
                                  <th className="pb-3 px-2">Items / Detail</th>
                                  <th className="pb-3 px-2 text-right">Amount</th>
                                  <th className="pb-3 px-2 text-right">Action</th>
                                </tr>
                              </thead>
                              <tbody className="divide-y divide-slate-100">
                                {(activeSalesman.transactions || []).map(tx => (
                                  <tr key={tx.id} className="hover:bg-slate-50">
                                    <td className="py-3.5 px-2 text-slate-400 font-bold">{tx.date}</td>
                                    <td className="py-3.5 px-2">
                                      <span className={`px-2.5 py-1 rounded-lg font-extrabold uppercase text-[9px] ${tx.type === 'stock' ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'}`}>
                                        {tx.type === 'stock' ? 'Maal Diya' : 'Cash Vasool'}
                                      </span>
                                    </td>
                                    <td className="py-3.5 px-2 font-bold text-slate-700 max-w-[240px] truncate" title={tx.note}>{tx.note}</td>
                                    <td className={`py-3.5 px-2 text-right font-extrabold text-sm ${tx.type === 'stock' ? 'text-rose-600' : 'text-emerald-600'}`}>
                                      {tx.type === 'stock' ? '+' : '-'} Rs. {Number(tx.amount || 0).toLocaleString()}
                                    </td>
                                    <td className="py-3.5 px-2 text-right">
                                      <button onClick={() => deleteKhataTx(activeSalesman.id, tx.id)} className="text-red-400 hover:text-red-600 font-extrabold px-2">✕</button>
                                    </td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          </div>
                        </div>

                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 3: DASHBOARD */}
            {activeTab === 'dashboard' && (
              <div className="space-y-6 fade-in">
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                  <div className="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-sm">
                    <div className="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center text-xl mb-3">💰</div>
                    <p className="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest">Total Cash Sales</p>
                    <h3 className="text-3xl font-extrabold text-slate-900 mt-1">Rs. {totalSales.toLocaleString()}</h3>
                  </div>
                  <div className="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-sm">
                    <div className="w-12 h-12 bg-amber-100 text-amber-600 rounded-2xl flex items-center justify-center text-xl mb-3">📒</div>
                    <p className="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest">Salesman Bakaya</p>
                    <h3 className="text-3xl font-extrabold text-amber-600 mt-1">Rs. {totalMarketBakaya.toLocaleString()}</h3>
                  </div>
