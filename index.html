                    <div className="w-12 h-12 bg-rose-100 text-rose-600 rounded-2xl flex items-center justify-center text-xl mb-3">📉</div>
                    <p className="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest">Total Expenses</p>
                    <h3 className="text-3xl font-extrabold text-slate-900 mt-1">Rs. {totalExp.toLocaleString()}</h3>
                  </div>
                  <div className={`p-6 rounded-3xl shadow-xl text-white ${netProfit >= 0 ? 'bg-gradient-to-br from-[#0B1120] to-slate-900 border border-slate-800' : 'bg-rose-600'}`}>

                    <p className="text-[10px] font-extrabold text-amber-400 uppercase tracking-widest">Net Cash Profit</p>
                    <h3 className="text-3xl font-extrabold mt-1">Rs. {netProfit.toLocaleString()}</h3>
                  </div>
                </div>

                <div className="bg-white p-6 sm:p-8 rounded-3xl border border-slate-200 shadow-sm">
                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 mb-6">
                    <div>
                      <h3 className="font-extrabold text-xl text-slate-900">📒 Salesman Khata List (Click Name for Weekly / Monthly / Yearly)</h3>
                      <p className="text-xs font-bold text-slate-400 mt-0.5">Kisi bhi salesman ke naam par click kar ke uska hafta-war, mahana aur salana hisab dekhein</p>
                    </div>
                    {isManager && (
                      <button onClick={() => setActiveTab('khata')} className="text-xs font-extrabold bg-[#0B1120] text-amber-400 px-4 py-2.5 rounded-xl hover:bg-slate-800 transition">
                        Manage All Khatas →
                      </button>
                    )}
                  </div>

                  {khatas.length === 0 ? (
                    <div className="text-center py-8 bg-slate-50 rounded-2xl border border-dashed border-slate-200">
                      <p className="text-sm font-bold text-slate-500">Abhi koi salesman add nahi hai.</p>
                      {isManager && (
                        <button onClick={() => setActiveTab('khata')} className="mt-2 text-xs font-extrabold text-indigo-600 underline">+ Salesman Add Karein</button>
                      )}
                    </div>
                  ) : (
                    <div className="overflow-x-auto hide-scroll">
                      <table className="w-full text-left text-sm whitespace-nowrap min-w-[650px]">
                        <thead className="text-[10px] font-extrabold uppercase tracking-widest text-slate-400 border-b">
                          <tr>
                            <th className="pb-4 px-2">Salesman Name (Click)</th>
                            <th className="pb-4 px-2">Route / Phone</th>
                            <th className="pb-4 px-2 text-right">Total Maal</th>
                            <th className="pb-4 px-2 text-right">Total Vasool</th>
                            <th className="pb-4 px-2 text-right">Net Bakaya</th>
                            <th className="pb-4 px-2 text-right">Report</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                          {khatas.map(sm => {
                            const st = getSalesmanStats(sm);
                            return (
                              <tr key={sm.id} className="hover:bg-amber-50/50 transition">
                                <td className="py-4 px-2">
                                  <button 
                                    onClick={() => { setDashSalesmanModalId(sm.id); setKhataPeriod('weekly'); }} 
                                    className="font-extrabold text-base text-indigo-700 hover:text-indigo-900 underline decoration-indigo-300 underline-offset-4 flex items-center gap-2"
                                  >
                                    <span>👤 {sm.name}</span>
                                  </button>
                                </td>
                                <td className="py-4 px-2 text-xs font-bold text-slate-500">
                                  {sm.route || 'No Route'} {sm.phone ? `(${sm.phone})` : ''}
                                </td>
                                <td className="py-4 px-2 text-right font-bold text-slate-700">Rs. {st.totalStock.toLocaleString()}</td>
                                <td className="py-4 px-2 text-right font-bold text-emerald-600">Rs. {st.totalPaid.toLocaleString()}</td>
                                <td className="py-4 px-2 text-right">
                                  <span className={`font-extrabold text-base px-3 py-1 rounded-xl ${st.balance > 0 ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'}`}>
                                    Rs. {st.balance.toLocaleString()}
                                  </span>
                                </td>
                                <td className="py-4 px-2 text-right">
                                  <button 
                                    onClick={() => { setDashSalesmanModalId(sm.id); setKhataPeriod('weekly'); }} 
                                    className="text-[10px] font-extrabold uppercase tracking-wider bg-[#0B1120] text-amber-400 px-3.5 py-2 rounded-xl hover:bg-slate-800 transition shadow-sm"
                                  >
                                    View Khata
                                  </button>
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>

                <div className="bg-white p-6 sm:p-8 rounded-3xl border border-slate-200/80 shadow-sm">
                  <h3 className="font-extrabold text-xl mb-6">
                    {isManager ? 'Recent Transactions (Manage Returns & Reprints)' : 'Recent Sales & Cash Recoveries (View Only)'}
                  </h3>
                  <div className="overflow-x-auto hide-scroll">
                    <table className="w-full text-left text-sm whitespace-nowrap min-w-[650px]">
                      <thead className="text-[10px] font-extrabold uppercase tracking-widest text-slate-400 border-b">
                        <tr>
                          <th className="pb-4 px-2">Order ID</th>
                          <th className="pb-4 px-2">Date/Time</th>
                          <th className="pb-4 px-2">Customer / Salesman</th>
                          <th className="pb-4 px-2">Type</th>
                          <th className="pb-4 px-2 text-right">Net Amount</th>
                          <th className="pb-4 px-2 text-right">Actions</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-50">
                        {sales.map(s => (
                          <tr key={s.id} className="hover:bg-slate-50">
                            <td className="py-4 px-2 font-extrabold text-slate-700">{s.id}</td>
                            <td className="py-4 px-2 text-xs font-bold text-slate-400">{s.date}</td>
                            <td className="py-4 px-2 font-bold">
                              {s.customer}
                              {s.refundedAmount > 0 && <span className="ml-2 text-[9px] bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-extrabold">Returned: Rs.{s.refundedAmount}</span>}
                            </td>
                            <td className="py-4 px-2"><span className={`text-[9px] px-3 py-1.5 rounded-lg font-extrabold uppercase tracking-widest ${s.type==='Khata Cash'?'bg-emerald-100 text-emerald-700':'bg-amber-100 text-amber-800'}`}>{s.type}</span></td>
                            <td className="py-4 px-2 text-right font-extrabold text-base">Rs. {s.amount}</td>
                            <td className="py-4 px-2 text-right space-x-2">
                              {s.items && (
                                <button onClick={() => setReceipt(s)} className="text-[10px] font-bold tracking-widest uppercase bg-slate-100 text-slate-700 px-3 py-2 rounded-xl hover:bg-[#0B1120] hover:text-amber-400 transition">View Bill</button>
                              )}
                              {isManager && (
                                <>
                                  <button onClick={() => openReturnModal(s)} className="text-[10px] font-bold tracking-widest uppercase bg-amber-50 border border-amber-200 text-amber-700 px-3 py-2 rounded-xl hover:bg-amber-500 hover:text-white transition">Return / Edit</button>
                                  <button onClick={() => deleteRecord(s.id, 'sale')} className="text-[10px] font-bold tracking-widest uppercase bg-red-50 border border-red-200 text-red-500 px-3 py-2 rounded-xl hover:bg-red-500 hover:text-white transition">Full Revert</button>
                                </>
                              )}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 4: EXPENSES */}
            {activeTab === 'expenses' && (
              <div className={`grid grid-cols-1 ${isManager ? 'lg:grid-cols-3' : ''} gap-6 fade-in`}>
                {isManager && (
                  <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm h-fit">
                    <h3 className="font-extrabold text-xl mb-6">Add Expense</h3>
                    <form onSubmit={(e)=>{ 
                      e.preventDefault(); 
                      if(!expForm.title || !expForm.amount) {
                        showNotify('Kharchay ki tafseel aur raqam likhein!', 'error');
                        return;
                      }
                      setExpenses([{ id: Date.now().toString(), date: new Date().toLocaleDateString(), ...expForm, amount: Number(expForm.amount) }, ...expenses]); 
                      setExpForm({title:'', amount:'', category:'Raw Material'}); 
                      showNotify('Expense record ho gaya!', 'success');
                    }} className="space-y-5">
                      <div>
                        <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest block mb-2">Detail / Bill Name</label>
                        <input type="text" value={expForm.title} onChange={e=>setExpForm({...expForm, title: e.target.value})} className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold focus:outline-none focus:border-slate-400" />
                      </div>
                      <div>
                        <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest block mb-2">Amount (Rs)</label>
                        <input type="number" value={expForm.amount} onChange={e=>setExpForm({...expForm, amount: e.target.value})} className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold focus:outline-none focus:border-slate-400" />
                      </div>
                      <div>
                        <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest block mb-2">Category Tag</label>
                        <select value={expForm.category} onChange={e=>setExpForm({...expForm, category: e.target.value})} className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold focus:outline-none">
                          <option>Raw Material</option><option>Utilities</option><option>Wages</option><option>Other</option>
                        </select>
                      </div>
                      <button type="submit" className="w-full bg-[#0B1120] hover:bg-slate-800 text-amber-400 font-extrabold py-4 rounded-2xl transition shadow-lg tracking-widest uppercase text-sm mt-2">Record Payment</button>
                    </form>
                  </div>
                )}

                <div className={`${isManager ? 'lg:col-span-2' : ''} bg-white p-8 rounded-3xl border border-slate-200 shadow-sm`}>
                  <div className="flex justify-between items-center mb-6">
                    <h3 className="font-extrabold text-xl">Expense Registry</h3>
                    <span className="bg-rose-50 text-rose-700 border border-rose-200 px-3.5 py-1.5 rounded-xl text-xs font-extrabold">
                      Total: Rs. {totalExp.toLocaleString()}
                    </span>
                  </div>
                  <div className="overflow-x-auto hide-scroll">
                    <table className="w-full text-left text-sm whitespace-nowrap min-w-[500px]">
                      <thead className="text-[10px] font-extrabold uppercase tracking-widest text-slate-400 border-b">
                        <tr>
                          <th className="pb-4 px-2">Date</th>
                          <th className="pb-4 px-2">Description</th>
                          <th className="pb-4 px-2">Tag</th>
                          <th className="pb-4 px-2 text-right">Cost</th>
                          {isManager && <th className="pb-4 px-2 text-right"></th>}
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-50">
                        {expenses.map(e => (
                          <tr key={e.id} className="hover:bg-slate-50 group">
                            <td className="py-4 px-2 text-xs font-bold text-slate-400">{e.date}</td>
                            <td className="py-4 px-2 font-extrabold text-slate-700">{e.title}</td>
                            <td className="py-4 px-2"><span className="text-[9px] bg-slate-100 px-3 py-1.5 rounded-lg font-extrabold uppercase tracking-widest text-slate-500">{e.category}</span></td>
                            <td className="py-4 px-2 text-right font-extrabold text-rose-500 text-base">Rs. {e.amount}</td>
                            {isManager && (
                              <td className="py-4 px-2 text-right"><button onClick={()=>deleteRecord(e.id, 'expense')} className="w-8 h-8 rounded-xl bg-white border border-slate-200 text-red-500 flex items-center justify-center opacity-100 md:opacity-0 group-hover:opacity-100 hover:bg-red-500 hover:text-white transition font-bold shadow-sm">✕</button></td>
                            )}
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 5: SETTINGS */}
            {activeTab === 'settings' && isManager && (
              <div className="space-y-6 fade-in">
                <div className="bg-white p-8 rounded-[2rem] border border-slate-200 shadow-sm space-y-6">
                  <div>
                    <h3 className="font-extrabold text-xl">Business Profile & Security Keys</h3>
                    <p className="text-xs font-bold text-slate-400 mt-0.5">Username, Mobile Number, Password aur Master Security Key yahan se manage karein</p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                    <div className="lg:col-span-2">
                      <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest block mb-2">Bakery Name (Prints on System & Receipts)</label>
                      <input type="text" value={settings.name} onChange={e=>setSettings({...settings, name:e.target.value})} className="w-full p-4 bg-amber-50 border border-amber-200 rounded-2xl text-base font-extrabold text-amber-900 focus:outline-none"/>
                    </div>
                    <div>
                      <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest block mb-2">Custom Logo URL (Empty = DAN Biscuit)</label>
                      <input type="text" placeholder="Leave empty for DAN Biscuit Logo" value={settings.logoUrl || ''} onChange={e=>setSettings({...settings, logoUrl:e.target.value})} className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-bold focus:outline-none"/>
                    </div>
                    <div className="lg:col-span-3">
                      <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest block mb-2">Shop Address (Prints on Invoices)</label>
                      <input type="text" value={settings.address} onChange={e=>setSettings({...settings, address:e.target.value})} className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold focus:outline-none"/>
                    </div>
                  </div>

                  {/* Owner Login & Security Key */}
                  <div className="p-5 rounded-3xl bg-emerald-50/70 border border-emerald-200 space-y-4">
                    <h4 className="font-extrabold text-sm text-emerald-800 uppercase tracking-wider">👑 Owner Login & Security Key (View Only)</h4>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                      <div>
                        <label className="text-[10px] font-extrabold text-slate-500 uppercase tracking-widest block mb-1.5">Owner Username</label>
                        <input type="text" placeholder="e.g. tony" value={settings.ownerUsername || ''} onChange={e=>setSettings({...settings, ownerUsername:e.target.value})} className="w-full p-3.5 bg-white border border-emerald-200 rounded-2xl text-sm font-extrabold text-emerald-900 focus:outline-none"/>
                      </div>
                      <div>
                        <label className="text-[10px] font-extrabold text-slate-500 uppercase tracking-widest block mb-1.5">Owner Mobile Number</label>
                        <input type="text" placeholder="e.g. 0300-1234567" value={settings.ownerContact} onChange={e=>setSettings({...settings, ownerContact:e.target.value})} className="w-full p-3.5 bg-white border border-emerald-200 rounded-2xl text-sm font-bold focus:outline-none"/>
                      </div>
                      <div>
                        <label className="text-[10px] font-extrabold text-emerald-700 uppercase tracking-widest block mb-1.5">Owner Password / PIN</label>
                        <input type="text" placeholder="••••" value={settings.ownerPin || ''} onChange={e=>setSettings({...settings, ownerPin:e.target.value})} className="w-full p-3.5 bg-white border border-emerald-300 rounded-2xl text-base font-extrabold tracking-widest text-emerald-800 focus:outline-none text-center"/>
                      </div>
                      <div>
                        <label className="text-[10px] font-extrabold text-amber-700 uppercase tracking-widest block mb-1.5">🔑 Owner Security Key</label>
                        <input type="text" placeholder="e.g. KEY-12345" value={settings.ownerSecurityKey || ''} onChange={e=>setSettings({...settings, ownerSecurityKey:e.target.value})} className="w-full p-3.5 bg-amber-50 border border-amber-300 rounded-2xl text-sm font-extrabold tracking-wider text-amber-900 focus:outline-none text-center"/>
                      </div>
                    </div>
                  </div>

                  {/* Manager Login & Security Key */}
                  <div className="p-5 rounded-3xl bg-amber-50/70 border border-amber-200 space-y-4">
                    <h4 className="font-extrabold text-sm text-amber-900 uppercase tracking-wider">👨‍💼 Manager Login & Security Key (Full Control)</h4>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                      <div>
                        <label className="text-[10px] font-extrabold text-slate-500 uppercase tracking-widest block mb-1.5">Manager Username</label>
                        <input type="text" placeholder="e.g. tony" value={settings.managerUsername || ''} onChange={e=>setSettings({...settings, managerUsername:e.target.value})} className="w-full p-3.5 bg-white border border-amber-200 rounded-2xl text-sm font-extrabold text-slate-900 focus:outline-none"/>
                      </div>
                      <div>
                        <label className="text-[10px] font-extrabold text-slate-500 uppercase tracking-widest block mb-1.5">Manager Mobile Number</label>
                        <input type="text" placeholder="e.g. 0300-1234567" value={settings.managerContact} onChange={e=>setSettings({...settings, managerContact:e.target.value})} className="w-full p-3.5 bg-white border border-amber-200 rounded-2xl text-sm font-bold focus:outline-none"/>
                      </div>
                      <div>
                        <label className="text-[10px] font-extrabold text-rose-600 uppercase tracking-widest block mb-1.5">Manager Password / PIN</label>
                        <input type="text" placeholder="••••" value={settings.pin} onChange={e=>setSettings({...settings, pin:e.target.value})} className="w-full p-3.5 bg-white border border-rose-300 rounded-2xl text-base font-extrabold tracking-widest text-rose-600 focus:outline-none text-center"/>
                      </div>
                      <div>
                        <label className="text-[10px] font-extrabold text-amber-800 uppercase tracking-widest block mb-1.5">🔑 Manager Security Key</label>
                        <input type="text" placeholder="e.g. KEY-12345" value={settings.managerSecurityKey || ''} onChange={e=>setSettings({...settings, managerSecurityKey:e.target.value})} className="w-full p-3.5 bg-amber-100/70 border border-amber-400 rounded-2xl text-sm font-extrabold tracking-wider text-amber-950 focus:outline-none text-center"/>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Add OR Edit Product */}
                <div className={`p-8 rounded-[2rem] shadow-xl text-white transition-colors ${editingProdId ? 'bg-indigo-950 border-2 border-indigo-400' : 'bg-[#0B1120]'}`}>
                  <div className="flex justify-between items-center border-b border-slate-800 pb-4 mb-6">
                    <h3 className="font-extrabold text-amber-400 text-xl">
                      {editingProdId ? `✏️ Editing Rates: ${prodForm.name}` : '➕ Add New Product to Menu'}
                    </h3>
                    {editingProdId && (
                      <button type="button" onClick={cancelEditProduct} className="bg-white/10 hover:bg-white/20 text-white px-4 py-2 rounded-xl text-xs font-bold">Cancel Edit</button>
                    )}
                  </div>

                  <form onSubmit={handleSaveProduct} className="space-y-6">
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                      <div>
                        <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest block mb-2">Product Name</label>
                        <input type="text" placeholder="e.g. Pastry" value={prodForm.name} onChange={e=>setProdForm({...prodForm, name: e.target.value})} className="w-full p-4 bg-slate-800 border border-slate-700 rounded-2xl text-sm font-bold text-white focus:outline-none"/>
                      </div>
                      <div>
                        <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest block mb-2">Category</label>
                        <input type="text" placeholder="e.g. Cakes" value={prodForm.category} onChange={e=>setProdForm({...prodForm, category: e.target.value})} className="w-full p-4 bg-slate-800 border border-slate-700 rounded-2xl text-sm font-bold text-white focus:outline-none"/>
                      </div>
                      <div>
                        <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest block mb-2">Packing Type</label>
                        <select value={prodForm.packingType} onChange={e=>setProdForm({...prodForm, packingType: e.target.value})} className="w-full p-4 bg-slate-800 border border-slate-700 rounded-2xl text-sm font-bold text-white focus:outline-none">
                          <option value="weight">Weight (1kg / 2kg)</option>
                          <option value="pack">Pack (1 Pack / 5 Pack)</option>
                        </select>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      <div className="bg-slate-800/50 p-6 rounded-2xl border border-slate-700 space-y-4">
                        <span className="text-xs font-extrabold text-amber-400 uppercase tracking-widest block">Special Pricing Matrix</span>
                        <div className="grid grid-cols-2 gap-3">
                          <div>
                            <label className="text-[9px] text-slate-400 font-bold uppercase block mb-1">Retail 1 (1kg/1Pk)</label>
                            <input type="number" placeholder="0" value={prodForm.sp1} onChange={e=>setProdForm({...prodForm, sp1: e.target.value})} className="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-sm font-bold text-white"/>
                          </div>
                          <div>
                            <label className="text-[9px] text-slate-400 font-bold uppercase block mb-1">Retail 2 (2kg/5Pk)</label>
                            <input type="number" placeholder="0" value={prodForm.sp2} onChange={e=>setProdForm({...prodForm, sp2: e.target.value})} className="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-sm font-bold text-white"/>
                          </div>
                          <div>
                            <label className="text-[9px] text-slate-400 font-bold uppercase block mb-1">Salesman / Khata Rate 1</label>
                            <input type="number" placeholder="0" value={prodForm.wsSp1} onChange={e=>setProdForm({...prodForm, wsSp1: e.target.value})} className="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-sm font-bold text-white"/>
                          </div>
                          <div>
                            <label className="text-[9px] text-slate-400 font-bold uppercase block mb-1">Salesman / Khata Rate 2</label>
                            <input type="number" placeholder="0" value={prodForm.wsSp2} onChange={e=>setProdForm({...prodForm, wsSp2: e.target.value})} className="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-sm font-bold text-white"/>
                          </div>
                        </div>
                      </div>

                      <div className="bg-slate-800/50 p-6 rounded-2xl border border-slate-700 space-y-4">
                        <span className="text-xs font-extrabold text-slate-300 uppercase tracking-widest block">Regular Pricing Matrix</span>
                        <div className="grid grid-cols-2 gap-3">
                          <div>
                            <label className="text-[9px] text-slate-400 font-bold uppercase block mb-1">Retail 1 (1kg/1Pk)</label>
                            <input type="number" placeholder="0" value={prodForm.reg1} onChange={e=>setProdForm({...prodForm, reg1: e.target.value})} className="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-sm font-bold text-white"/>
                          </div>
                          <div>
                            <label className="text-[9px] text-slate-400 font-bold uppercase block mb-1">Retail 2 (2kg/5Pk)</label>
                            <input type="number" placeholder="0" value={prodForm.reg2} onChange={e=>setProdForm({...prodForm, reg2: e.target.value})} className="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-sm font-bold text-white"/>
                          </div>
                          <div>
                            <label className="text-[9px] text-slate-400 font-bold uppercase block mb-1">Salesman / Khata Rate 1</label>
                            <input type="number" placeholder="0" value={prodForm.wsReg1} onChange={e=>setProdForm({...prodForm, wsReg1: e.target.value})} className="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-sm font-bold text-white"/>
                          </div>
                          <div>
                            <label className="text-[9px] text-slate-400 font-bold uppercase block mb-1">Salesman / Khata Rate 2</label>
                            <input type="number" placeholder="0" value={prodForm.wsReg2} onChange={e=>setProdForm({...prodForm, wsReg2: e.target.value})} className="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-sm font-bold text-white"/>
                          </div>
                        </div>
                      </div>
                    </div>
                    <button type="submit" className={`w-full font-extrabold py-4 rounded-2xl uppercase tracking-widest text-sm transition shadow-lg ${editingProdId ? 'bg-indigo-500 hover:bg-indigo-400 text-white' : 'bg-amber-400 hover:bg-amber-300 text-slate-950'}`}>
                      {editingProdId ? 'Update Product Rates' : 'Save New Product'}
                    </button>
                  </form>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div className="bg-[#0B1120] p-8 rounded-[2rem] shadow-xl text-white">
                    <h3 className="font-extrabold text-amber-400 text-xl border-b border-slate-800 pb-4 mb-4">Existing Menu Items (Edit Rates / Delete)</h3>
                    <div className="max-h-[340px] overflow-y-auto divide-y divide-slate-800 pr-2">
                      {products.map(p => (
                        <div key={p.id} className="py-4 flex justify-between items-center gap-2">
                          <div>
                            <p className="font-extrabold text-sm">{p.name}</p>
                            <p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mt-1">
                              {p.category} | Spl: Rs.{p.sp1} | Khata: Rs.{p.wsSp1 || p.sp1}
                            </p>
                          </div>
                          <div className="flex items-center gap-2 shrink-0">
                            <button onClick={() => startEditProduct(p)} className="bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-3.5 py-2 rounded-xl text-xs font-bold hover:bg-indigo-500 hover:text-white transition">Edit</button>
                            <button onClick={()=>{ 
                              if(window.confirm('Delete item permanently?')) {
                                setProducts(products.filter(x=>x.id!==p.id));
                                showNotify('Item menu se delete kar diya gaya.', 'info');
                              }
                            }} className="bg-red-500/20 text-red-300 border border-red-500/30 px-3.5 py-2 rounded-xl text-xs font-bold hover:bg-red-500 hover:text-white transition">Delete</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="bg-gradient-to-br from-emerald-600 to-teal-700 p-8 rounded-[2rem] shadow-xl text-white flex flex-col justify-center items-start">
                    <div className="w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center text-3xl mb-6 shadow-inner">📊</div>
                    <h3 className="font-extrabold text-2xl mb-2">Excel Backup</h3>
                    <p className="text-sm text-emerald-50 font-medium mb-8 opacity-90 leading-relaxed">Download a complete CSV spreadsheet of all your sales, Khata balances, and expenses.</p>
                    <button onClick={()=>{
                      let csv = 'Type,ID,Date,Detail,Category,Returned,Net_Amount\n';
                      sales.forEach(s => csv += `Sale,${s.id},"${s.date}","${s.customer}",${s.type},${s.refundedAmount || 0},${s.amount}\n`);
                      khatas.forEach(k => { const st = getSalesmanStats(k); csv += `Khata_Balance,${k.id},"${new Date().toLocaleDateString()}","${k.name} (${k.phone})",Bakaya,0,${st.balance}\n`; });
                      expenses.forEach(e => csv += `Expense,${e.id},"${e.date}","${e.title}",${e.category},0,${e.amount}\n`);
                      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = `${settings.name}_Backup.csv`; a.click();
                      showNotify('Excel CSV Backup download ho gaya!', 'success');
                    }} className="w-full bg-white text-emerald-800 font-extrabold py-4 rounded-2xl shadow-lg tracking-widest uppercase text-sm hover:scale-[1.02] transition-transform">Download File</button>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* MOBILE BOTTOM NAVIGATION */}
          <nav className="md:hidden fixed bottom-0 w-full bg-[#0B1120] text-white flex justify-around p-2 pb-safe border-t border-slate-800 z-40">
            {isManager && (
              <button onClick={() => setActiveTab('pos')} className={`flex flex-col items-center p-2 w-16 ${activeTab==='pos'?'text-amber-400':'text-slate-400'}`}><span className="text-xl">🛒</span><span className="text-[9px] font-bold mt-1">POS</span></button>
            )}
            {isManager && (
              <button onClick={() => setActiveTab('khata')} className={`flex flex-col items-center p-2 w-16 ${activeTab==='khata'?'text-rose-400':'text-slate-400'}`}><span className="text-xl">📒</span><span className="text-[9px] font-bold mt-1">Khata</span></button>
            )}
            <button onClick={() => setActiveTab('dashboard')} className={`flex flex-col items-center p-2 w-20 ${activeTab==='dashboard'?'text-amber-400':'text-slate-400'}`}><span className="text-xl">📈</span><span className="text-[9px] font-bold mt-1">Dashboard</span></button>
            <button onClick={() => setActiveTab('expenses')} className={`flex flex-col items-center p-2 w-20 ${activeTab==='expenses'?'text-emerald-400':'text-slate-400'}`}><span className="text-xl">💵</span><span className="text-[9px] font-bold mt-1">Expenses</span></button>
            {isManager && (
              <button onClick={() => setActiveTab('settings')} className={`flex flex-col items-center p-2 w-16 ${activeTab==='settings'?'text-white':'text-slate-400'}`}><span className="text-xl">⚙️</span><span className="text-[9px] font-bold mt-1">Set</span></button>
            )}
          </nav>

          {/* SALESMAN WEEKLY / MONTHLY / YEARLY KHATA MODAL */}
          {modalSalesman && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4 z-50 fade-in">
              <div className="bg-white rounded-[2rem] w-full max-w-3xl max-h-[92vh] overflow-hidden shadow-2xl flex flex-col">
                
                <div className="p-5 sm:p-6 bg-[#0B1120] text-white flex justify-between items-start gap-4 shrink-0">
                  <div>
                    <span className="text-[10px] font-extrabold uppercase tracking-widest text-amber-400 block">Salesman Khata Statement</span>
                    <h3 className="text-2xl font-extrabold mt-0.5">{modalSalesman.name}</h3>
                    <p className="text-xs text-slate-400 font-bold mt-0.5">
                      {modalSalesman.phone || 'No Phone'} {modalSalesman.route ? `• Route: ${modalSalesman.route}` : ''}
                    </p>
                  </div>
                  <div className="flex items-center gap-3">
                    <div className="text-right bg-white/10 px-4 py-2 rounded-2xl">
                      <span className="text-[9px] uppercase font-bold text-slate-300 block">Total Bakaya</span>
                      <span className={`text-lg sm:text-xl font-extrabold ${modalOverallStats.balance > 0 ? 'text-rose-400' : 'text-emerald-400'}`}>
                        Rs. {modalOverallStats.balance.toLocaleString()}
                      </span>
                    </div>
                    <button onClick={() => setDashSalesmanModalId(null)} className="w-9 h-9 rounded-full bg-white/10 hover:bg-rose-500 text-white font-extrabold transition">✕</button>
                  </div>
                </div>

                <div className="p-3 sm:p-4 bg-slate-100 border-b border-slate-200 flex flex-wrap gap-2 shrink-0">
                  {[
                    { id: 'weekly', label: '📅 Weekly (Last 7 Days)' },
                    { id: 'monthly', label: '🗓️ Monthly (This Month)' },
                    { id: 'yearly', label: '📆 Yearly (This Year)' },
                    { id: 'all', label: '📚 All-Time History' }
                  ].map(tab => (
                    <button 
                      key={tab.id} 
                      onClick={() => setKhataPeriod(tab.id)} 
                      className={`flex-1 py-2.5 px-3 rounded-xl text-xs font-extrabold transition whitespace-nowrap ${khataPeriod === tab.id ? 'bg-[#0B1120] text-amber-400 shadow' : 'bg-white text-slate-600 hover:bg-slate-200'}`}
                    >
                      {tab.label}
                    </button>
                  ))}
                </div>

                <div className="p-4 sm:p-6 overflow-y-auto flex-1 space-y-5">
                  <div className="grid grid-cols-3 gap-3 sm:gap-4">
                    <div className="bg-rose-50 p-4 rounded-2xl border border-rose-100">
                      <span className="text-[9px] sm:text-[10px] font-extrabold text-rose-600 uppercase block">
                        {khataPeriod === 'weekly' ? 'Weekly Maal' : khataPeriod === 'monthly' ? 'Monthly Maal' : khataPeriod === 'yearly' ? 'Yearly Maal' : 'Total Maal'}
                      </span>
                      <span className="text-base sm:text-xl font-extrabold text-rose-700 mt-1 block">Rs. {modalPeriodStats.stock.toLocaleString()}</span>
                    </div>
                    <div className="bg-emerald-50 p-4 rounded-2xl border border-emerald-100">
                      <span className="text-[9px] sm:text-[10px] font-extrabold text-emerald-600 uppercase block">
                        {khataPeriod === 'weekly' ? 'Weekly Vasooli' : khataPeriod === 'monthly' ? 'Monthly Vasooli' : khataPeriod === 'yearly' ? 'Yearly Vasooli' : 'Total Vasooli'}
                      </span>
                      <span className="text-base sm:text-xl font-extrabold text-emerald-700 mt-1 block">Rs. {modalPeriodStats.paid.toLocaleString()}</span>
                    </div>
                    <div className="bg-[#0B1120] text-white p-4 rounded-2xl">
                      <span className="text-[9px] sm:text-[10px] font-extrabold text-amber-400 uppercase block">
                        Period Net Difference
                      </span>
                      <span className="text-base sm:text-xl font-extrabold mt-1 block">Rs. {modalPeriodStats.netChange.toLocaleString()}</span>
                    </div>
                  </div>

                  <div>
                    <h4 className="font-extrabold text-sm text-slate-700 mb-3 uppercase tracking-wider">
                      Entries ({modalPeriodStats.txs.length})
                    </h4>
                    {modalPeriodStats.txs.length === 0 ? (
                      <div className="text-center py-8 bg-slate-50 rounded-2xl border border-slate-100 text-xs font-bold text-slate-400">
                        Is period mein koi khata entry maujood nahi hai.
                      </div>
                    ) : (
                      <div className="overflow-x-auto border border-slate-200 rounded-2xl">
                        <table className="w-full text-left text-xs whitespace-nowrap">
                          <thead className="bg-slate-50 text-[10px] font-extrabold uppercase text-slate-400 border-b">
                            <tr>
                              <th className="py-3 px-3">Date / Time</th>
                              <th className="py-3 px-3">Type</th>
                              <th className="py-3 px-3">Items / Detail</th>
                              <th className="py-3 px-3 text-right">Amount</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100">
                            {modalPeriodStats.txs.map(tx => (
                              <tr key={tx.id} className="hover:bg-slate-50">
                                <td className="py-3 px-3 text-slate-500 font-bold">{tx.date}</td>
                                <td className="py-3 px-3">
                                  <span className={`px-2.5 py-1 rounded-lg font-extrabold uppercase text-[9px] ${tx.type === 'stock' ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'}`}>
                                    {tx.type === 'stock' ? 'Maal Diya' : 'Cash Vasool'}
                                  </span>
                                </td>
                                <td className="py-3 px-3 font-bold text-slate-800 max-w-[260px] truncate" title={tx.note}>{tx.note}</td>
                                <td className={`py-3 px-3 text-right font-extrabold text-sm ${tx.type === 'stock' ? 'text-rose-600' : 'text-emerald-600'}`}>
                                  {tx.type === 'stock' ? '+' : '-'} Rs. {Number(tx.amount || 0).toLocaleString()}
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    )}
                  </div>
                </div>

                <div className="p-4 bg-slate-100 border-t flex flex-wrap gap-2 justify-between items-center shrink-0">
                  {isManager ? (
                    <button 
                      onClick={() => { 
                        const id = modalSalesman.id;
                        setDashSalesmanModalId(null); 
                        setSelectedSalesmanId(id); 
                        setActiveTab('khata'); 
                      }} 
                      className="bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold px-5 py-3 rounded-xl text-xs uppercase tracking-wider shadow transition"
                    >
                      💵 Receive Payment / Open Full Khata
                    </button>
                  ) : (
                    <span className="text-xs font-extrabold text-slate-500">👑 Owner View Only</span>
                  )}
                  <button onClick={() => setDashSalesmanModalId(null)} className="bg-slate-300 hover:bg-slate-400 text-slate-800 font-extrabold px-6 py-3 rounded-xl text-xs uppercase tracking-wider transition ml-auto">
                    Close
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* PARTIAL RETURN / BILL EDIT MODAL */}
          {returnModalSale && isManager && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4 z-50 fade-in">
              <div className="bg-white rounded-[2rem] w-full max-w-lg max-h-[90vh] overflow-hidden shadow-2xl flex flex-col">
                <div className="p-6 border-b border-slate-100 flex justify-between items-center bg-amber-50">
                  <div>
                    <h3 className="font-extrabold text-lg text-slate-900">Return / Adjust Bill ({returnModalSale.id})</h3>
                    <p className="text-xs font-bold text-slate-500">Customer: {returnModalSale.customer}</p>
                  </div>
                  <button onClick={() => setReturnModalSale(null)} className="w-8 h-8 rounded-full bg-white text-slate-600 font-extrabold">✕</button>
                </div>

                <div className="p-6 overflow-y-auto flex-1 space-y-6">
                  {returnModalSale.items && returnModalSale.items.length > 0 && (
                    <div>
                      <p className="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest mb-3">1. Return Specific Items (Reduce Qty)</p>
                      <div className="divide-y divide-slate-100 border border-slate-200 rounded-2xl px-4">
                        {returnModalSale.items.map((item, idx) => (
                          <div key={idx} className="py-3 flex justify-between items-center gap-2">
                            <div>
                              <p className="font-bold text-xs sm:text-sm text-slate-800">{item.name}</p>
                              <p className="text-[10px] text-slate-400 font-bold">Rs.{item.price} × {item.qty} = Rs.{item.price * item.qty}</p>
                            </div>
                            <button onClick={() => adjustReturnItemQty(idx, -1)} className="px-3 py-1.5 rounded-xl bg-rose-100 text-rose-700 font-extrabold text-xs hover:bg-rose-500 hover:text-white transition">- Return 1</button>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200">
                    <label className="text-[10px] font-extrabold text-slate-500 uppercase tracking-widest block mb-2">2. Direct Amount Return (e.g., Deduct Rs. 1,000)</label>
                    <div className="flex gap-2">
                      <input type="number" placeholder="Enter return amount (Rs)" value={customRefundAmt} onChange={e => setCustomRefundAmt(e.target.value)} className="flex-1 p-3 bg-white border border-slate-200 rounded-xl text-sm font-extrabold focus:outline-none" />
                      <button type="button" onClick={applyCustomRefund} className="bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold px-5 rounded-xl text-xs uppercase tracking-wider transition">Deduct</button>
                    </div>
                  </div>

                  <div className="bg-[#0B1120] text-white p-5 rounded-2xl space-y-2">
                    <div className="flex justify-between text-xs text-slate-400 font-bold">
                      <span>Total Returned / Deducted:</span>
                      <span className="text-amber-400">Rs. {returnModalSale.refundedAmount || 0}</span>
                    </div>
                    <div className="flex justify-between items-center pt-2 border-t border-slate-800">
                      <span className="text-xs font-extrabold uppercase tracking-widest">Updated Net Bill:</span>
                      <span className="text-2xl font-extrabold text-emerald-400">Rs. {returnModalSale.amount}</span>
                    </div>
                  </div>
                </div>

                <div className="p-4 bg-slate-100 border-t flex gap-2">
                  <button onClick={saveReturnChanges} className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-3.5 rounded-xl text-xs uppercase tracking-widest shadow-lg transition">Save Updated Bill</button>
                  <button onClick={() => setReturnModalSale(null)} className="px-5 bg-slate-300 text-slate-800 font-extrabold py-3.5 rounded-xl text-xs uppercase tracking-widest">Cancel</button>
                </div>
              </div>
            </div>
          )}

          {/* INVOICE & KHATA SLIP PRINT MODAL */}
          {receipt && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4 z-50 fade-in">
              <div className="bg-white rounded-[2rem] w-full max-w-md max-h-[92vh] overflow-hidden shadow-2xl flex flex-col">
                
                <div id="printable-area" className="bg-white p-5 sm:p-6 text-slate-900 overflow-y-auto flex-1 space-y-4">
                  <div className="text-center border-b-2 border-dashed border-slate-300 pb-3 flex flex-col items-center">
                    <div className="mb-2">
                      <BrandLogo size="sm" customLogoUrl={settings.logoUrl} />
                    </div>
                    <h2 className="font-extrabold text-xl sm:text-2xl uppercase tracking-wide break-words leading-snug">{settings.name}</h2>
                    <p className="text-[11px] font-bold text-slate-600 uppercase tracking-wider mt-1 leading-snug">
                      {receipt.isKhataSlip ? receipt.txType : `Official ${receipt.type} Bill`}
                    </p>
                  </div>
                  
                  <div className="text-xs font-bold text-slate-700 space-y-1.5 border-b border-slate-200 pb-3">
                    <div className="flex justify-between items-start gap-2">
                      <span className="text-slate-500 shrink-0">Slip / Order ID:</span>
                      <span className="text-slate-900 font-extrabold text-right break-all">{receipt.orderId || receipt.id}</span>
                    </div>
                    <div className="flex justify-between items-start gap-2">
                      <span className="text-slate-500 shrink-0">Date:</span>
                      <span className="text-right break-words">{receipt.date}</span>
                    </div>
                    <div className="flex justify-between items-start gap-2">
                      <span className="text-slate-500 shrink-0">{receipt.isKhataSlip ? 'Salesman:' : 'Customer:'}</span>
                      <span className="text-slate-900 font-extrabold uppercase text-right break-words">{receipt.customer}</span>
                    </div>
                    {receipt.phone && (
                      <div className="flex justify-between items-start gap-2">
                        <span className="text-slate-500 shrink-0">Phone:</span>
                        <span className="text-right">{receipt.phone}</span>
                      </div>
                    )}
                  </div>
                  
                  <div className="text-xs space-y-2">
                    <div className="flex justify-between font-extrabold text-[10px] text-slate-400 uppercase tracking-wider border-b border-slate-200 pb-1.5">
                      <span>Item / Description</span>
                      <span className="shrink-0 ml-2">Amount</span>
                    </div>
                    <div className="divide-y divide-slate-100">
                      {receipt.items.map((i, idx) => (
                        <div key={idx} className="py-2.5 flex justify-between items-start gap-3">
                          <div className="flex-1 min-w-0 pr-1">
                            <p className="font-bold text-slate-900 break-words leading-normal">{i.name}</p>
                            {!receipt.isDirectEntry && (
                              <p className="text-[10px] text-slate-500 font-semibold mt-0.5 leading-normal">
                                Rs. {i.price} × {i.qty}
                              </p>
                            )}
                          </div>
                          <span className="font-extrabold text-sm text-slate-900 shrink-0 text-right whitespace-nowrap">
                            Rs. {(i.price * i.qty).toLocaleString()}
                          </span>
                        </div>
                      ))}
                    </div>
                  </div>

                  {receipt.isKhataSlip ? (
                    <div className="border-t-2 border-slate-900 pt-3 space-y-2 text-xs font-bold">
                      {receipt.discount > 0 && (
                        <div className="flex justify-between items-center text-red-600">
                          <span>Discount:</span>
                          <span>- Rs. {receipt.discount.toLocaleString()}</span>
                        </div>
                      )}
                      <div className="flex justify-between items-center text-slate-600">
                        <span>Previous Bakaya:</span>
                        <span>Rs. {receipt.previousBalance.toLocaleString()}</span>
                      </div>
                      <div className="flex justify-between items-center text-slate-800">
                        <span>Today's Entry:</span>
                        <span>Rs. {receipt.amount.toLocaleString()}</span>
                      </div>
                      <div className="flex justify-between items-center font-extrabold pt-2.5 mt-1 border-t border-dashed border-slate-400 text-sm sm:text-base">
                        <span className="uppercase">Net Bakaya:</span>
                        <span className="text-lg sm:text-xl">Rs. {receipt.newBalance.toLocaleString()}</span>
                      </div>
                    </div>
                  ) : (
                    <div className="border-t-2 border-slate-900 pt-3 space-y-2 text-xs font-bold">
                      {receipt.discount > 0 && (
                        <div className="flex justify-between items-center text-slate-600">
                          <span>Discount:</span>
                          <span>- Rs. {receipt.discount.toLocaleString()}</span>
                        </div>
                      )}
                      {receipt.refundedAmount > 0 && (
                        <div className="flex justify-between items-center text-amber-700">
                          <span>Returned / Deducted:</span>
                          <span>- Rs. {receipt.refundedAmount.toLocaleString()}</span>
                        </div>
                      )}
                      <div className="flex justify-between items-center font-extrabold pt-1 text-sm sm:text-base">
                        <span className="uppercase">Net Pay:</span>
                        <span className="text-xl sm:text-2xl">Rs. {(receipt.total !== undefined ? receipt.total : receipt.amount).toLocaleString()}</span>
                      </div>
                    </div>
                  )}

                  <div className="pt-4 border-t border-slate-200 text-center space-y-1.5">
                    <p className="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Thank you for visiting us!</p>
                    <div className="text-[10px] font-bold text-slate-600 leading-relaxed break-words">
                      {settings.address && <p className="italic">{settings.address}</p>}
                      {settings.ownerContact && <p className="mt-1">📞 {settings.ownerContact} ({settings.owner})</p>}
                      {settings.managerContact && <p>📞 {settings.managerContact} ({settings.manager})</p>}
                    </div>
                  </div>
                </div>

                <div className="bg-slate-100 p-3 sm:p-4 flex gap-2 no-print border-t shrink-0">
                  <button onClick={() => window.print()} className="flex-1 bg-[#0B1120] hover:bg-slate-800 text-amber-400 font-extrabold py-3.5 rounded-xl transition shadow-lg text-xs uppercase tracking-widest">🖨️ Print Slip</button>
                  <button onClick={() => setReceipt(null)} className="px-5 bg-slate-300 hover:bg-slate-400 text-slate-800 font-extrabold py-3.5 rounded-xl transition text-xs uppercase tracking-widest">Close</button>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<BakeryPOS />);
